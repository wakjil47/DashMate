<!doctype html>
<html>
<head>
<script>(function(){var q=/[?&]theme=(dark|light)/.exec(location.search),m=q&&q[1];
try{if(!m&&window.AutoDeck&&AutoDeck.theme)m=AutoDeck.theme();}catch(e){}
if(!m)m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=m;
window.ddTheme=function(t){document.documentElement.dataset.theme=(t==='dark'?'dark':'light');};})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* One base unit (--u) drives every size: scales with the smaller screen side.
     --hs = Home text size, --ts = per-widget text size (both from the phone app). */
  :root { --u: clamp(9px, min(2.3vh, 1.3vw), 24px); --hs: 1; --cols: 12; }
  html { font-size: calc(var(--u) * var(--hs)); }
  /* Text minimums follow the text-size settings too (--k = widget × Home text size), so the
     phone's sliders always change what the car shows: 150% makes a 16px minimum 24px.
     Never below 12px, the design system's hard minimum. Touch targets (48 / 56px) stay fixed. */
  :root { --k: var(--hs, 1); }
  :root, .w {
    --f12: max(12px, calc(12px * var(--k))); --f13: max(12px, calc(13px * var(--k)));
    --f14: max(12px, calc(14px * var(--k))); --f15: max(12px, calc(15px * var(--k)));
    --f16: max(12px, calc(16px * var(--k))); --f17: max(12px, calc(17px * var(--k)));
  }
  /* Theme tokens (design/tokens.json). Day = white; night = soft charcoal (html[data-theme="dark"]). */
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --surface-2: #F1F5F9; --border: #E2E8F0;
    --ink: #0F172A; --ink-2: #475569; --ink-3: #64748B;
    --accent: #0F766E; --on-accent: #FFFFFF; --danger: #DC2626; --ok: #15803D;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.06);
    --photo-surface: rgba(255,255,255,.94); /* tile plate over a photo / song cover */
    --amber: #B45309; --rain: #0369A1;
  }
  :root[data-theme="dark"] {
    --bg: #0F1115; --surface: #181B21; --surface-2: #20242B; --border: #2A2F37;
    --ink: #F1F5F9; --ink-2: #A3ACB9; --ink-3: #7C8594;
    --accent: #2DD4BF; --on-accent: #042F2E; --danger: #F87171; --ok: #4ADE80;
    --shadow: none;
    --photo-surface: rgba(24,27,33,.90);
    --amber: #FBBF24; --rain: #7DD3FC;
  }
  :root {
    /* Old names, kept for the rules below. */
    --dim: var(--ink-2); --glass: var(--surface-2); --edge: var(--border);
    --red: var(--danger); --green: var(--ok); --violet: var(--accent);
    /* Tinted text that stays readable on its own tint, both themes. */
    --accent-ink: color-mix(in srgb, var(--accent) 82%, var(--ink));
    --danger-ink: color-mix(in srgb, var(--danger) 82%, var(--ink));
    --tile-bg: var(--surface);
    /* Floating clock: ink on the plain background, white + soft shadow on a picture. */
    --clock: var(--ink); --clock-shadow: none;
  }
  body.mode-photo:not(.pg-custom), body.mode-upload:not(.pg-custom), body.mode-cover.art:not(.pg-custom) {
    --tile-bg: var(--photo-surface); --clock: #FFFFFF; --clock-shadow: 0 2px 12px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; color: var(--ink); background: var(--bg);
    font-family: "Google Sans", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* ---------- Background: photo / song cover / plain ---------- */
  body:not(.ready) #grid { visibility: hidden; }
  #plain { position: fixed; inset: 0; background: var(--bg); }
  #photo, #bg { position: fixed; inset: 0; background: center/cover no-repeat; opacity: 0; transition: opacity .25s ease; }
  #bg { filter: brightness(.6); }
  body.mode-photo #photo, body.mode-upload #photo { opacity: 1; }
  body.mode-cover.art #bg { opacity: 1; }
  #dim { position: fixed; inset: 0; background: #000; opacity: .35; transition: opacity .2s; }
  /* Dim + edge shade only over a picture; the plain background stays clean. */
  #dim, #shade { display: none; }
  body.mode-photo #dim, body.mode-upload #dim, body.mode-cover.art #dim,
  body.mode-photo #shade, body.mode-upload #shade, body.mode-cover.art #shade { display: block; }
  /* Darken only the edges where text sits; the middle stays clear. */
  #shade { position: fixed; inset: 0; background:
      linear-gradient(180deg, rgba(0,0,0,.45) 0%, transparent 32%, transparent 62%, rgba(0,0,0,.5) 100%); }
  #credit { position: fixed; right: 1.4rem; bottom: .3rem; font-size: .66rem; color: var(--clock); opacity: .7; text-shadow: var(--clock-shadow); }

  /* No backdrop blur (too costly on head units): a darker tint keeps text readable. */
  .dim { color: var(--dim); }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shadow { text-shadow: var(--clock-shadow); }

  /* Even margin all round: the DashMate button floats and can be moved anywhere. */
  #app { position: relative; height: 100%; padding: calc(var(--u) * 1.2) calc(var(--u) * 1.4); }
  /* Small Android Auto panel (split screen, e.g. 460×370): the floating dock bar (16 dp + 46 dp tall)
     would sit on the top row of tiles, so keep a strip free for it. Same test as isSmallPanel(). */
  @media (max-width: 619px) and (max-aspect-ratio: 27/20) and (min-aspect-ratio: 20/21) {
    #app { padding-top: calc(var(--u) * .6 + 66px); }
    /* Fuel: three prices need the whole tile width, so drop the pump icon. */
    .w[data-w="fuel"] .info > .ic { display: none; }
    #fuelText { gap: .9em; }
  }

  /* ---------- Tablet-style widget grid (12 × 8 cells): always fits one screen. 8 rows by default;
     more widgets add rows and every row shares the height (no scrolling, nothing cut off). ---------- */
  #grid { height: 100%; display: grid; gap: max(8px, calc(var(--u) * .7)); grid-auto-flow: row dense;
          grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
          grid-template-rows: repeat(var(--rows, 8), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); overflow: hidden; }
  /* ---------- Widgets ----------
     Each tile is a size container: text, icons and covers scale with the tile itself
     (cqw / cqh), times --k = this widget's text size × whole-Home text size. Tall or
     narrow tiles switch layout with @container rules. Pure CSS: no JS, no timers. */
  .w { display: none; container: tile / size; min-width: 0; min-height: 0; overflow: hidden;
       border-radius: calc(var(--u) * 1.4); --k: calc(var(--ts, 1) * var(--hs, 1)); }
  .w.on { display: block; }
  .w.sq { border-radius: calc(var(--u) * .2); }
  .in { width: 100%; height: 100%; display: flex; min-width: 0; min-height: 0;
        padding: clamp(10px, min(13cqh, 5.5cqw), 22px) clamp(14px, min(15cqh, 6.5cqw), 26px); }
  /* Solid plate: surface colour, hairline edge, soft shadow by day. No blur. */
  .tile { background: var(--tile-bg); border: 1px solid var(--border); box-shadow: var(--shadow); }
  /* Owner, 26 Oct: rounder, softer cards (solid, no blur). */
  .w.tile:not(.sq) { border-radius: max(22px, calc(var(--u) * 2.3)); }
  .tile { box-shadow: 0 8px 28px -12px rgba(15,23,42,.16), 0 1px 3px rgba(15,23,42,.05); }
  :root[data-theme="dark"] .tile { box-shadow: none; }
  .w[data-ta="center"] .in { text-align: center; }
  .w[data-ta="right"] .in { text-align: right; }
  /* Phone widget editor only (never on the car). */
  .w.hl { outline: calc(var(--u) * .25) solid var(--accent); outline-offset: calc(var(--u) * -.25); }

  /* Clock: no tile, floats on the background */
  .w[data-w="clock"] .in { flex-direction: column; justify-content: center; align-items: flex-start; }
  .w[data-w="clock"][data-ta="center"] .in { align-items: center; }
  .w[data-w="clock"][data-ta="right"] .in { align-items: flex-end; }
  #time { font-size: calc(min(58cqh, 27cqw) * var(--k)); line-height: .95; letter-spacing: -.03em;
          font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--clock); text-shadow: var(--clock-shadow); }
  #time .ap { font-size: .32em; font-weight: 500; margin-left: .25em; letter-spacing: .02em; }
  #date { font-size: max(var(--f14), calc(min(11cqh, 5.5cqw) * var(--k))); margin-top: .35em; opacity: .88; white-space: nowrap; font-weight: 500; color: var(--clock); text-shadow: var(--clock-shadow); }
  body.cf-thin #time { font-weight: 200; }
  body.cf-bold #time { font-weight: 700; letter-spacing: -.05em; }
  body.cf-serif #time { font-family: serif; font-weight: 400; }
  body.cf-mono #time { font-family: monospace; font-weight: 400; letter-spacing: 0; }
  body.cf-script #time { font-family: cursive; font-weight: 400; letter-spacing: 0; }
  /* More clock styles: Android system font families + static CSS effects (no downloads, no animation). */
  body.cf-black #time { font-weight: 900; letter-spacing: -.05em; }
  body.cf-condensed #time { font-family: sans-serif-condensed; font-weight: 400; letter-spacing: -.02em; }
  body.cf-wide #time { font-weight: 300; letter-spacing: .12em; }
  body.cf-italic #time { font-weight: 200; font-style: italic; }
  body.cf-casual #time { font-family: casual; font-weight: 400; letter-spacing: 0; }
  body.cf-outline #time { font-weight: 800; color: transparent; -webkit-text-stroke: .025em var(--clock); }
  /* Google Fonts (bundled subsets, see fonts/README.txt). */
  @font-face { font-family: 'dd-orbitron'; src: url('fonts/orbitron.woff2') format('woff2'); }
  body.cf-orbitron #time { font-family: 'dd-orbitron', sans-serif; font-weight: 400; letter-spacing: 0; }
  @font-face { font-family: 'dd-bebas'; src: url('fonts/bebas.woff2') format('woff2'); }
  body.cf-bebas #time { font-family: 'dd-bebas', sans-serif; font-weight: 400; letter-spacing: 0; }
  @font-face { font-family: 'dd-audiowide'; src: url('fonts/audiowide.woff2') format('woff2'); }
  body.cf-audiowide #time { font-family: 'dd-audiowide', sans-serif; font-weight: 400; letter-spacing: 0; }
  @font-face { font-family: 'dd-teko'; src: url('fonts/teko.woff2') format('woff2'); }
  body.cf-teko #time { font-family: 'dd-teko', sans-serif; font-weight: 400; letter-spacing: 0; }
  @font-face { font-family: 'dd-poiret'; src: url('fonts/poiret.woff2') format('woff2'); }
  body.cf-poiret #time { font-family: 'dd-poiret', sans-serif; font-weight: 400; letter-spacing: 0; }
  @font-face { font-family: 'dd-monoton'; src: url('fonts/monoton.woff2') format('woff2'); }
  body.cf-monoton #time { font-family: 'dd-monoton', sans-serif; font-weight: 400; letter-spacing: 0; }
  body.cf-bebas #time, body.cf-teko #time { font-size: calc(min(70cqh, 33cqw) * var(--k)); }
  body.cf-neon #time { font-weight: 300; color: var(--clock); text-shadow: 0 0 .18em var(--accent); }

  /* Info tiles (prayer, weather, football, fuel): icon + text in a row; stacked when tall */
  .info { align-items: center; gap: max(10px, min(8cqh, 4.5cqw)); }
  .w[data-ta="center"] .info { justify-content: center; }
  .w[data-ta="right"] .info { flex-direction: row-reverse; }
  .info .ic { font-size: calc(min(44cqh, 17cqw) * var(--k)); line-height: 1; flex: none; display: flex; align-items: center; justify-content: center; }
  .info .txt { min-width: 0; max-width: 100%; overflow: hidden; display: flex; flex-direction: column; gap: .22em; }
  .w[data-ta="left"] .info .txt, .w:not([data-ta]) .info .txt { flex: 1; }
  .t1 { font-size: max(var(--f16), calc(min(17cqh, 6.5cqw) * var(--k))); font-weight: 600; letter-spacing: -0.01em; }
  .big { font-size: calc(min(36cqh, 11cqw) * var(--k)); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; color: var(--ink); }
  .sub { font-size: max(var(--f15), calc(min(16cqh, 6cqw) * var(--k))); color: var(--dim); font-weight: 500; }
  #scoreText { font-weight: 600; }
  #scoreSub .lv { color: var(--danger-ink); font-weight: 700; }
  .w.tile[data-w="prayer"], .w.tile[data-w="fuel"] { cursor: pointer; }
  #fuelText { display: flex; gap: 1.4em; overflow: hidden; align-items: center; }
  #fuelText .fu { display: flex; flex-direction: column; min-width: 0; }
  #fuelText .fu small { font-size: .85em; color: var(--dim); white-space: nowrap; font-weight: 600; letter-spacing: 0.02em; }
  #fuelText .fu b { font-size: 1.3em; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.15; }
  .w[data-w="football"] { background: color-mix(in srgb, var(--danger) 8%, var(--tile-bg)); border-color: color-mix(in srgb, var(--danger) 28%, var(--border)); }
  @container tile (max-aspect-ratio: 1/1) {
    .info { flex-direction: column; justify-content: center; text-align: center; }
    .info .txt { align-items: center; }
    .info .ic { font-size: calc(min(26cqh, 34cqw) * var(--k)); }
    .big { font-size: calc(min(16cqh, 22cqw) * var(--k)); }
    .t1, .sub { font-size: max(var(--f14), calc(min(8cqh, 11cqw) * var(--k))); }
  }

  /* Music — three layouts picked by the tile's shape:
       block (default, up to ~2.6:1): cover left; text, progress and controls stacked on the right
       strip (wider than 2.6:1):      cover · text · controls in one row
       tall  (taller than wide):      cover / text / controls stacked
     Text sizes follow the text column itself (#music is its own inline-size container),
     so it can't get squeezed into "Play s…". */
  .mus { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
         column-gap: max(10px, min(8cqh, 4cqw)); row-gap: max(6px, min(5cqh, 2.5cqw)); align-items: center; }
  /* --as: album art size from the phone (1 = default); rows cap it at the tile height. */
  #cover { grid-row: 1 / span 2; height: calc(100% * min(1, var(--as, 1))); max-width: calc(42cqw * var(--as, 1)); aspect-ratio: 1; border-radius: clamp(10px, min(12cqh, 5cqw), 20px);
           background: var(--surface-2) center/cover no-repeat; box-shadow: var(--shadow);
           display: grid; place-items: center; font-size: calc(min(28cqh, 9cqw) * var(--k)); color: var(--dim); }
  .w.noart .mus { grid-template-columns: minmax(0, 1fr); }
  .w.noart #cover { display: none; }
  #music { container-type: inline-size; min-width: 0; min-height: 0; max-height: 100%; overflow: hidden; align-self: end;
           display: flex; flex-direction: column; gap: .3em; }
  #songRow { display: flex; gap: .6em; align-items: baseline; font-size: max(var(--f14), calc(min(7.5cqw, 10cqh) * var(--k))); }
  .w[data-ta="center"] #songRow { justify-content: center; }
  .w[data-ta="right"] #songRow { justify-content: flex-end; }
  #song { font-weight: 700; color: var(--ink); min-width: 0; flex: 0 1 auto; }
  #artist { color: var(--dim); min-width: 0; flex: 0 1 auto; font-weight: 500; }
  #line { font-size: max(var(--f17), calc(min(13cqw, 17cqh) * var(--k))); font-weight: 700; line-height: 1.25; color: var(--ink);
          white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #next { font-size: max(var(--f14), calc(min(8cqw, 10cqh) * var(--k))); color: var(--dim); font-weight: 500; }
  #progress { height: max(3px, 3cqh); border-radius: 99px; background: var(--border); overflow: hidden; margin-top: .35em; }
  /* Full width, scaled from the left (transform only: no layout per frame). */
  #progressFill { height: 100%; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: 0 50%; will-change: transform; }
  #controls { grid-column: 2; align-self: start; display: flex; align-items: center; gap: max(8px, min(6cqh, 2.8cqw)); }
  .w[data-ta="center"] #controls { justify-content: center; }
  .w[data-ta="right"] #controls { justify-content: flex-end; }
  .w.noart #controls { grid-column: 1; }
  .ctl { width: max(48px, min(18cqh, 10cqw)); height: max(48px, min(18cqh, 10cqw)); border-radius: 50%; border: 1px solid var(--border);
         background: var(--surface-2);
         display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: none; transition: transform .15s ease; }
  .ctl svg { width: 50%; height: 50%; fill: var(--ink); }
  .ctl.play { width: max(56px, min(24cqh, 13cqw)); height: max(56px, min(24cqh, 13cqw)); background: var(--accent); border-color: var(--accent); }
  .ctl.play svg { fill: var(--on-accent); width: 48%; height: 48%; }
  .ctl:active { transform: scale(.92); }
  #music > * { flex: none; }   /* drop whole lines, never squash one */
  /* Tall screens (same test as isTallScreen): a smaller lyric line so the song, line, next line and
     progress fit the tile instead of being cut half-way; buttons at least driver size (56 px).
     Placed before the shape rules below so they still win for strip / tall tiles. */
  @media (max-aspect-ratio: 20/21) {
    #line { font-size: max(var(--f17), calc(min(10cqw, 11cqh) * var(--k))); }
    .ctl { min-width: 56px; min-height: 56px; }
    .ctl.play { min-width: 64px; min-height: 64px; }
  }
  @container tile (max-height: 180px) { #next { display: none; } }
  @container tile (max-height: 200px) { #line { -webkit-line-clamp: 1; } }
  /* Small block: the text gets the whole tile (a tiny cover helps nobody). */
  @container tile (max-width: 260px) and (min-aspect-ratio: 1/1) {
    .mus { grid-template-columns: minmax(0, 1fr); }
    #cover { display: none; }
    #controls { grid-column: 1; }
    .ctl { width: min(24cqh, 16cqw); height: min(24cqh, 16cqw); }
    .ctl.play { width: min(30cqh, 20cqw); height: min(30cqh, 20cqw); }
  }

  /* Strip: one row. */
  @container tile (min-aspect-ratio: 13/5) {
    .mus { display: flex; align-items: center; gap: max(12px, min(6cqh, 3cqw)); }
    .w.noart .mus { display: flex; align-items: center; gap: max(12px, min(6cqh, 3cqw)); }
    #cover { height: 100%; width: auto; max-width: none; flex: none; }
    #music { flex: 1; min-width: 0; align-self: center; }
    #line { -webkit-line-clamp: 1; }
    #controls { align-self: center; flex: none; }
    .ctl { width: max(48px, min(34cqh, 8cqw)); height: max(48px, min(34cqh, 8cqw)); }
    .ctl.play { width: max(56px, min(44cqh, 10cqw)); height: max(56px, min(44cqh, 10cqw)); }
  }
  @container tile (min-aspect-ratio: 13/5) and (max-width: 430px) { .ctl:not(.play) { display: none; } }

  /* Tall: album on top, lyrics in the middle, controls at the bottom. */
  @container tile (max-aspect-ratio: 1/1) {
    .mus { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; text-align: center; }
    /* Bigger art is capped at half the tile so the song and a full lyric line still fit. */
    #cover { grid-row: 1; height: auto; width: min(calc(min(80cqw, 40cqh) * var(--as, 1)), 50cqh, 92cqw); max-width: none; }
    #music { width: 100%; align-self: center; }
    #songRow { justify-content: center; }
    #line { -webkit-line-clamp: 3; }
    #controls { grid-column: 1; justify-content: center; }
    .ctl { width: min(12cqh, 22cqw); height: min(12cqh, 22cqw); }
    .ctl.play { width: min(15cqh, 27cqw); height: min(15cqh, 27cqw); }
  }


  /* ---------- Custom-page widgets ---------- */
  .tl { font-size: max(var(--f14), calc(min(9cqh, 4.5cqw) * var(--k))); color: var(--dim); letter-spacing: .01em; font-weight: 600; }
  .na { margin: auto; text-align: center; color: var(--dim); font-size: max(var(--f14), calc(min(10cqh, 5cqw) * var(--k))); }

  /* Forecast: now · next hours · 7 days (rows drop as the tile gets smaller) */
  .fc { flex-direction: column; gap: min(4cqh, 2cqw); }
  #fcNow { display: flex; align-items: center; gap: .5em; font-size: max(var(--f14), calc(min(11cqh, 4.5cqw) * var(--k))); }
  #fcNow .ic { font-size: 2.6em; line-height: 1; }
  #fcNow .t { font-size: 2.4em; font-weight: 300; line-height: 1; }
  #fcNow .d { display: flex; flex-direction: column; color: var(--dim); }
  #fcHours { display: flex; justify-content: space-between; gap: .2em; font-size: max(var(--f14), calc(min(6.5cqh, 3.2cqw) * var(--k))); }
  #fcHours .h { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: .15em;
                padding: .4em 0; border-radius: .8em; background: var(--surface-2); }
  #fcHours .h .i { font-size: 1.6em; line-height: 1; }
  #fcHours .h .r, #fcDays .r { color: var(--rain); font-size: max(var(--f13), .85em); }
  /* Rows that don't fit wrap into a hidden second column: a day shows whole or not at all. */
  #fcDays { display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: .15em; font-size: max(var(--f14), calc(min(6.2cqh, 3.4cqw) * var(--k))); min-height: 0; overflow: hidden; }
  #fcDays .d { width: 100%; display: grid; grid-template-columns: 3.2em 1.8em 3em 2.6em 1fr 2.6em; align-items: center; gap: .4em; }
  #fcDays .d .i { font-size: 1.3em; text-align: center; }
  #fcDays .lo { color: var(--dim); text-align: right; }
  #fcDays .bar { height: .35em; border-radius: 99px; background: var(--border); position: relative; }
  #fcDays .bar b { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, #7cc4ff, #ffd36e); }

                                       #fcDays .d { grid-template-columns: 3.2em 1.8em 3em 2.6em 2.6em; } }

  /* Weather dashboard (big tile, e.g. the Custom page): hero card · hourly strip · day cards */
  .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 1.1em; }

  @container tile (min-width: 440px) and (min-height: 280px) {

             }

    #fcNow .hl b { color: var(--ink); margin-left: .3em; }

                   font-size: 1em; line-height: 1.45; color: var(--dim); }
    #fcNow .note b { display: block; color: var(--ink); font-size: 1.15em; margin-bottom: .3em; }
    #fcHours { flex: none; padding: .7em .6em; gap: .3em; font-size: inherit; }

    #fcHours .h b { font-size: 1.25em; font-weight: 500; }
    #fcDays { flex: 1; flex-direction: row; flex-wrap: nowrap; gap: .45em; font-size: inherit; overflow: hidden; width: 100%; padding: 0 2px 2px 0; }
    #fcDays .d { flex: 1 1 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em;
                 background: var(--tile-bg); border: 1px solid var(--border); border-radius: 1.1em; }
    #fcDays .d:first-child { background: color-mix(in srgb, var(--accent) 10%, var(--tile-bg)); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }

  }
  /* Short car screens (≈480 px): drop the least useful bits instead of shrinking text. */

    #fcDays .d .r, #fcDays .d .lo { display: none; }

  /* Air quality + UV */
  .aq { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: min(3cqh, 2cqw); }
  #aqVal { font-size: calc(min(30cqh, 26cqw) * var(--k)); font-weight: 700; line-height: 1; }
  #aqCat { font-size: max(var(--f13), calc(min(8cqh, 8cqw) * var(--k))); font-weight: 700; padding: .25em .8em; border-radius: 99px; }
  #aqMore { display: flex; flex-wrap: wrap; justify-content: center; gap: .4em 1em; font-size: max(var(--f14), calc(min(7cqh, 7cqw) * var(--k))); color: var(--dim); }
  #aqMore b { color: var(--ink); }
  @container tile (min-aspect-ratio: 2/1) { .aq { flex-direction: row; gap: 1.2em; } #aqVal { font-size: calc(min(45cqh, 14cqw) * var(--k)); } }

  /* Rain radar: map tiles + radar overlay, centred on the prayer zone */

            color: var(--ink); background: var(--photo-surface); padding: .15em .6em; border-radius: 99px; }

  #rdDot.car.heading::after { content: ""; position: absolute; left: 50%; top: -14px; margin-left: -7px; border: 7px solid transparent;
               border-bottom: 10px solid #2563EB; transform-origin: 7px 21px; transform: rotate(var(--bearing, 0deg)); }

  #rdSwitch { position: absolute; right: .5em; top: .5em; z-index: 2; display: flex; padding: 3px; gap: 2px; border-radius: 99px;
              background: var(--surface);
              border: 1px solid var(--border); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #rdSwitch button { border: 0; background: transparent; color: var(--ink-2); font-family: inherit; font-weight: 600; font-size: max(13px, calc(min(5cqh, 2.6cqw) * var(--k))); line-height: 1;

  /* YouTube: search + quick pages; opens YouTube in the car browser (video plays only when parked). */

  .yt-c { display: flex; gap: .6em; }
  .yt .yt-c button { flex: 1; min-width: 0; justify-content: center; padding: 0 .6em; background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; font-size: .82em;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }

  /* EV charging (Open Charge Map): list of nearest chargers; map beside it on wide tiles */
  .evw { flex-direction: column; gap: min(2.5cqh, 1.4cqw); }
  .ev-b { flex: 1; min-height: 0; display: flex; gap: 1em; }
  #evList { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .6em; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
            font-size: max(var(--f16), calc(min(6cqh, 3.6cqw) * var(--k)));
            -webkit-mask-image: linear-gradient(#000 calc(100% - 1.5em), transparent); mask-image: linear-gradient(#000 calc(100% - 1.5em), transparent); }
  .ch { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .3em 1em; align-items: center; padding: .75em 1em;
        border-radius: 1.1em; background: var(--surface-2);
        border: 1px solid var(--border); cursor: pointer; flex: none; }

           background: var(--accent); color: var(--on-accent); font-size: .85em; }
  .ch.down .n { background: var(--danger); }
  /* Name + access pill on line 1; plugs then operator (cut with …) on line 2: a card stays two lines. */
  .ch .nm { display: flex; align-items: center; gap: .6em; min-width: 0; }

  .ch .sub .plug { flex: none; }
  .ch .op { color: var(--dim); margin-left: .2em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plug { padding: .15em .6em; border-radius: 99px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent-ink); font-weight: 700; white-space: nowrap; }
  #evMap .pin.no { background: var(--danger); }
  .acc { padding: .15em .6em; border-radius: 99px; font-weight: 700; white-space: nowrap; }
  .acc.no { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger-ink); }
  .acc.mb { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
  .plug.fast { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
  #evMap { display: none; position: relative; overflow: hidden; border-radius: 1.1em; background: var(--surface-2); border: 1px solid var(--border); }
  #evMap img { position: absolute; width: 256px; height: 256px; }
  :root[data-theme="dark"] #evMap img { filter: invert(.92) hue-rotate(180deg) saturate(.4) brightness(.9); }

  .evw .tl { font-size: max(var(--f14), calc(min(6cqh, 3.2cqw) * var(--k))); }

  /* Sports: grouped by league; each game a card (crest · name | score + status pill | crest · name) */
  .sp { flex-direction: column; gap: min(3cqh, 1.4cqw); }
  .sp-h { display: flex; align-items: center; gap: .8em; font-size: max(var(--f14), calc(min(7cqh, 3.2cqw) * var(--k))); }
  .sp-h .tl { font-size: 1em; }
  .sp-live { display: none; align-items: center; gap: .4em; padding: .2em .8em; border-radius: 99px; font-size: .8em; font-weight: 700;
             color: var(--danger-ink); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  .sp-live i { width: .5em; height: .5em; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent); }
  #spList { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: .9em;
            font-size: max(var(--f14), calc(min(6cqh, 3.6cqw) * var(--k))); }

  /* Tabs (Games · My teams · Tables) on big tiles; football tables from football-data.org */

  #spChips { display: none; gap: .4em; flex-wrap: wrap; font-size: max(var(--f14), calc(min(4.4cqh, 2.4cqw) * var(--k))); }

                    border: 1px solid var(--border); color: var(--dim); font-weight: 600; }

  .tb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }

  .wk-h { display: flex; align-items: center; gap: .9em; margin-bottom: .9em; }

          grid-template-rows: auto auto minmax(0, 1fr); border-radius: 1.1em; overflow: hidden;
          background: var(--surface-2); border: 1px solid var(--border); }
  .wk-dh { padding: .45em 0 .5em; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .1em; }
  .wk-dh small { font-size: .7em; letter-spacing: .1em; color: var(--dim); font-weight: 600; }
  .wk-dh b { font-size: 1.25em; font-weight: 600; width: 1.9em; line-height: 1.9em; border-radius: 50%; }
  .wk-dh.we small, .wk-dh.we b { opacity: .55; }
  .wk-dh.td small { color: var(--accent); }
  .wk-dh.td b { background: var(--accent); color: var(--on-accent); opacity: 1; }
  .wk-ad { min-height: 1.5em; padding: .15em .2em; display: flex; flex-direction: column; gap: .15em; overflow: hidden;
           border-bottom: 1px solid var(--border); }
  .wk-tm { position: relative; }
  .wk-tm span { position: absolute; right: .55em; transform: translateY(-50%); font-size: .8em; color: var(--ink-2); white-space: nowrap; }
  .wk-col { position: relative; border-left: 1px solid var(--border);
            background-image: linear-gradient(var(--border) 1px, transparent 1px); background-size: 100% var(--hr); }
  .wk-col.td { background-color: color-mix(in srgb, var(--accent) 6%, transparent); }
  .wk-col.we { background-color: color-mix(in srgb, var(--ink) 4%, transparent); }
  .wk-e { position: absolute; left: 3px; right: 3px; padding: .3em .45em; border-radius: .55em; overflow: hidden;
          border-left: 3px solid; font-size: .88em; line-height: 1.25; }
  .wk-e b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wk-e span { color: var(--ink-2); font-size: .9em; }
  .wk-e.past { opacity: .45; }
  .wk-ad .wk-e { position: static; padding: .12em .45em; box-shadow: none; }
  /* Day / Week / Month switch */
  .cv { display: flex; flex: none; padding: .2em; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); }
  .cv button { all: unset; cursor: pointer; padding: .4em 1.1em; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center; border-radius: 99px; font-size: .9em; font-weight: 600; color: var(--dim); }
  .cv button.on { background: var(--accent); color: var(--on-accent); }
  /* Day view: one wide column */
  .wk-g.day { grid-template-columns: 3.4em minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .wk-g.day .wk-e { left: .6em; right: .6em; font-size: 1.05em; padding: .45em .8em; }
  .wk-g.day .wk-e { display: flex; align-items: baseline; gap: .9em; }
  .wk-g.day .wk-e b { flex: 0 1 auto; min-width: 0; }
  .wk-g.day .wk-e span { white-space: nowrap; }
  .wk-g.day .wk-ad { flex-direction: row; flex-wrap: wrap; }
  /* Week board: 7 day columns, events stacked in time order (readable at car size) */
  .wb { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .45em; }
  .wb-c { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: .4em; padding: .55em .45em;
          border-radius: 1em; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden;
          -webkit-mask-image: linear-gradient(#000 calc(100% - 1.6em), transparent); mask-image: linear-gradient(#000 calc(100% - 1.6em), transparent); }
  .wb-c.td { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .wb-c.we { background: color-mix(in srgb, var(--ink) 4%, var(--surface-2)); }
  .wb-h { display: flex; flex-direction: column; align-items: center; gap: .1em; padding-bottom: .35em; margin-bottom: .1em;
          border-bottom: 1px solid var(--border); flex: none; }
  .wb-h small { font-size: .85em; font-weight: 700; letter-spacing: .1em; color: var(--ink-2); }
  .wb-h b { font-size: 1.35em; font-weight: 700; width: 1.9em; line-height: 1.9em; text-align: center; border-radius: 50%; }
  .wb-c.td .wb-h small { color: var(--accent); }
  .wb-c.td .wb-h b { background: var(--accent); color: var(--on-accent); }
  .wb-e { flex: none; padding: .4em .5em; border-radius: .6em; border-left: 3px solid; line-height: 1.25; }
  .wb-e .t { font-size: .88em; font-weight: 700; font-variant-numeric: tabular-nums; opacity: .9; }
  .wb-e b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; font-size: .92em; }
  .wb-e.past { opacity: .45; }
  .wb-e.now { box-shadow: 0 0 0 2px var(--accent); }
  .wb-none { margin: auto 0; text-align: center; font-size: .8em; color: var(--ink-3); }

  /* Day view: today's events as big cards */
  .dv { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); grid-auto-rows: min-content;
        gap: .7em; align-content: start; overflow: hidden;
        -webkit-mask-image: linear-gradient(#000 calc(100% - 1.6em), transparent); mask-image: linear-gradient(#000 calc(100% - 1.6em), transparent); }
  .dv-e { display: flex; gap: .9em; padding: .9em 1em; border-radius: 1em; border-left: 4px solid; line-height: 1.3; }
  .dv-e .tm { flex: none; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
  .dv-e .tm b { font-size: 1.35em; font-weight: 700; }
  .dv-e .tm span { font-size: .85em; color: var(--ink-2); }
  .dv-e .bd { min-width: 0; }
  .dv-e .bd b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 1.1em; font-weight: 600; }
  .dv-e .bd span { display: block; font-size: .85em; color: var(--ink-2); margin-top: .2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dv-e.now { box-shadow: 0 0 0 2px var(--accent); }
  .dv-e.now .bd span:first-of-type { color: var(--accent-ink); }
  .dv-e.past { opacity: .45; }
  .dv-none { grid-column: 1 / -1; padding: 3em 0; text-align: center; color: var(--ink-2); font-size: 1.1em; }

  /* Event details popup (tap an event) */
  #calPop { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
            background: rgba(4,6,12,.62); font-size: max(var(--f14), calc(2.6vh * var(--hs, 1))); }
  #calPop.on { display: flex; }
  .cp { width: min(34em, 86vw); max-height: 84vh; overflow: hidden; display: flex; flex-direction: column; border-radius: 1.3em;
        background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: 0 1.5em 4em rgba(15,23,42,.25); }
  .cp-bar { height: .45em; flex: none; }
  .cp-in { padding: 1.1em 1.3em 1.2em; display: flex; flex-direction: column; gap: .7em; min-height: 0; overflow: hidden; }
  .cp-top { display: flex; align-items: flex-start; gap: .8em; }
  .cp-top b { flex: 1; font-size: 1.45em; line-height: 1.2; }
  .cp-x { all: unset; cursor: pointer; flex: none; width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center;
          background: var(--surface-2); color: var(--ink); font-size: 1em; }
  .cp-row { display: flex; gap: .7em; align-items: baseline; color: var(--ink); }
  .cp-row i { font-style: normal; width: 1.4em; flex: none; text-align: center; }
  .cp-row .sub { color: var(--ink-2); }
  .cp-notes { white-space: pre-line; color: var(--ink-2); font-size: .92em; line-height: 1.45; padding: .8em 1em; border-radius: .8em;
              background: var(--surface-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
  .cp-now { align-self: flex-start; font-size: .8em; font-weight: 700; padding: .25em .8em; border-radius: 99px; background: var(--accent); color: var(--on-accent); }
  .cp-list { display: flex; flex-direction: column; gap: .5em; overflow: hidden; }
  .cp-li { display: flex; gap: .7em; padding: .6em .8em; border-radius: .8em; background: var(--surface-2); cursor: pointer; }
  .cp-li i { width: .3em; border-radius: 99px; flex: none; }
  .cp-li .tm { font-weight: 700; font-variant-numeric: tabular-nums; width: 3.3em; flex: none; }
  [data-ev], [data-day] { cursor: pointer; }

  /* Month view */
  .mo { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto;
        grid-auto-rows: minmax(0, 1fr); border-radius: 1.1em; overflow: hidden; background: var(--surface-2);
        border: 1px solid var(--border); }
  .mo .mw { padding: .45em 0; text-align: center; font-size: .78em; letter-spacing: .1em; font-weight: 600; color: var(--dim);
            border-bottom: 1px solid var(--border); }
  .mo .mc { min-width: 0; min-height: 0; padding: .25em .3em; overflow: hidden; display: flex; flex-direction: column; gap: .15em;
            border-left: 1px solid var(--border); border-top: 1px solid var(--border); }
  .mo .mc:nth-child(7n+1) { border-left: 0; }
  .mo .mc.o { opacity: .3; }
  .mo .mc.we { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  .mo .mc.td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .mo .mc > b { font-size: .95em; font-weight: 600; width: 1.8em; line-height: 1.8em; text-align: center; border-radius: 50%; flex: none; }
  .mo .mc.td > b { background: var(--accent); color: var(--on-accent); }
  .mo .me { font-size: max(var(--f12), .85em); padding: .1em .4em; border-radius: .35em; border-left: 2px solid; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; flex: none; }
  .mo .mm { font-size: .7em; color: var(--dim); padding-left: .4em; }

  .wk-now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--danger); z-index: 2; }
  .wk-now::before { content: ''; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%;
                    background: var(--danger); box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 25%, transparent); }

  /* Custom page: no Home photo; each function has its own calm background, solid tiles on top. */
  body.pg-custom .tile { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow); }
  body.pg-custom #dim, body.pg-custom #shade, body.pg-custom #credit { display: none; }
  body.fn-weather #plain { background: color-mix(in srgb, #3B82F6 7%, var(--bg)); }
  body.fn-calendar #plain { background: var(--bg); }
  body.fn-sports #plain { background: color-mix(in srgb, #16A34A 6%, var(--bg)); }
  body.fn-radar #plain { background: var(--bg); }

  /* Agenda (small / medium tiles): date header · week strip · events grouped by day.
     Readable minimums: nothing under ~12px on the car. */
  #calHead { display: none; align-items: center; gap: .6em; flex: none; font-size: max(var(--f13), calc(min(7cqh, 4.6cqw) * var(--k))); }
  #calHead .dn { font-size: 2.6em; font-weight: 700; line-height: 1; color: var(--accent-ink); letter-spacing: -.03em; }
  #calHead .dw { display: flex; flex-direction: column; line-height: 1.2; }
  #calHead .dw b { font-size: 1.1em; }
  #calHead .dw span { color: var(--ink-2); font-size: .9em; }
  #calEvents { font-size: max(var(--f13), calc(min(7.5cqh, 4.8cqw) * var(--k))) !important; gap: .55em !important;
               -webkit-mask-image: linear-gradient(#000 calc(100% - 2em), transparent); mask-image: linear-gradient(#000 calc(100% - 2em), transparent); }
  .ag-d { font-size: max(var(--f12), .8em); font-weight: 700; letter-spacing: .01em; color: var(--ink-2); margin-top: .3em; }
  .ag-d:first-child { margin-top: 0; }
  .ag-d.td { color: var(--accent-ink); }
  .ag { display: grid; grid-template-columns: 3.3em .25em minmax(0, 1fr); gap: .65em; align-items: stretch; }
  .ag .at { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; padding-top: .05em; line-height: 1.25; }
  .ag .at small { display: block; font-weight: 500; font-size: max(var(--f12), .82em); color: var(--ink-2); }
  .ag i { border-radius: 99px; }
  .ag .ab { min-width: 0; line-height: 1.25; }
  .ag .ab b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag .ab span { display: block; font-size: max(var(--f13), .85em); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag.now .ab b { color: var(--accent-ink); }
  .ag.past { opacity: .5; }
  #calStrip { display: none; gap: .3em; font-size: max(var(--f12), calc(min(7cqh, 4.4cqw) * var(--k))); }
  #calStrip .sd { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .15em; padding: .35em 0; border-radius: .7em; }
  #calStrip .sd small { font-size: .72em; color: var(--dim); font-weight: 600; letter-spacing: .06em; }
  #calStrip .sd b { font-size: 1.15em; }
  #calStrip .sd.td { background: var(--accent); color: var(--on-accent); }
  #calStrip .sd.td small { color: var(--on-accent); }
  #calStrip .sd i { width: .35em; height: .35em; border-radius: 50%; background: var(--ink-2); visibility: hidden; }
  #calStrip .sd.ev i { visibility: visible; }
  .sd.td i { background: var(--on-accent); }
  /* Not tall enough for a readable month grid: week strip + events. */
  @container tile (max-height: 360px) and (max-width: 619px), (max-height: 299px) {
    .cal { flex-direction: column; }
    .cal #calMonth { display: none; }
    #calStrip { display: flex; flex: none; }
    #calHead { display: flex; }
  }
  @container tile (max-height: 230px) { #calHead { display: none !important; } }
  @container tile (max-height: 150px) { #calStrip { display: none !important; } }

  /* Calendar: month grid + upcoming events (side by side when wide) */
  .cal { gap: min(5cqh, 3cqw); }
  #calMonth { flex: none; display: flex; flex-direction: column; font-size: max(var(--f13), calc(min(5.4cqh, 3.2cqw) * var(--k))); }
  #calMonth .mh { font-weight: 700; margin-bottom: .4em; }
  #calMonth .grid { display: grid; grid-template-columns: repeat(7, 2.1em); gap: .15em; text-align: center; }
  #calMonth .wd { color: var(--dim); font-size: .8em; }
  #calMonth .dy { line-height: 2em; border-radius: 50%; position: relative; }
  #calMonth .dy.o { color: var(--ink-3); opacity: .6; }
  #calMonth .dy.td { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  #calMonth .dy.ev::after { content: ''; position: absolute; left: 50%; bottom: .15em; width: .3em; height: .3em; margin-left: -.15em;
                             border-radius: 50%; background: var(--ink-2); }
  #calEvents { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .4em; font-size: max(var(--f14), calc(min(6cqh, 3.4cqw) * var(--k)));
               min-height: 0; overflow: hidden; }
  .ev { display: flex; gap: .6em; align-items: stretch; }
  .ev i { width: .3em; border-radius: 99px; flex: none; }
  .ev .et { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .ew { color: var(--dim); font-size: .85em; }
  /* Not wide: month on top (sized by width), the next events under it. */
  @container tile (max-aspect-ratio: 13/10) {
    .cal { flex-direction: column; }
    #calMonth { align-self: center; font-size: max(var(--f13), calc(min(4cqh, 5.2cqw) * var(--k))); }
    #calEvents { font-size: max(var(--f14), calc(min(5.5cqh, 6cqw) * var(--k))); }
  }
  /* Too small for a month grid: events only. */
  @container tile (max-width: 180px), (max-height: 150px) { #calMonth { display: none; } }

  /* Speed */
  .spd { flex-direction: column; align-items: center; justify-content: center; }
  .w[data-ta="left"] .spd { align-items: flex-start; }
  .w[data-ta="right"] .spd { align-items: flex-end; }
  #speed { font-size: calc(min(55cqh, 38cqw) * var(--k)); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
  #speedUnit { font-size: max(var(--f13), calc(min(13cqh, 10cqw) * var(--k))); color: var(--dim); margin-top: .3em; font-weight: 500; letter-spacing: 0.05em; }

  /* Shortcuts: icons sized to fit the tile (--n = how many) */
  #shortcuts { flex-wrap: wrap; align-content: center; justify-content: center; gap: max(8px, min(8cqh, 3.5cqw));
               --ic: max(48px, min(60cqh, calc(76cqw / var(--n, 2)))); }
  .w[data-ta="left"] #shortcuts { justify-content: flex-start; }
  .w[data-ta="right"] #shortcuts { justify-content: flex-end; }
  .app { width: var(--ic); height: var(--ic); border-radius: 28%; border: 1px solid var(--border);
         background: var(--surface-2); color: var(--ink);
         display: grid; place-items: center; cursor: pointer;
         font-weight: 700; font-size: calc(var(--ic) * .42); transition: transform .15s ease; }
  .app:active { transform: scale(.92); background: var(--border); }
  .app img { width: 64%; height: 64%; border-radius: 22%; object-fit: contain; }

  /* Tall screens: the floating dock (16 dp + 46 dp) sits over the top row, so keep a strip free for it. */
  @media (max-aspect-ratio: 20/21) {
    html:not(.dock-in-strip) #app { padding-top: calc(var(--u) * .5 + 62px); }
  }
  /* The phone editor's Left / Center / Right alignment wins over the square/tall tile defaults.
     Icon and text move together (stacked layout), so a tile never mixes a centred icon with left text. */
  @container tile (max-aspect-ratio: 1/1) {
    .w[data-ta="left"] .info { flex-direction: column; align-items: flex-start; text-align: left; } .w[data-ta="left"] .info .txt { align-items: flex-start; }
    .w[data-ta="right"] .info { flex-direction: column; align-items: flex-end; text-align: right; } .w[data-ta="right"] .info .txt { align-items: flex-end; }
    .w[data-ta="center"] .info, .w:not([data-ta]) .info { align-items: center; }
    /* Music on a tall tile: cover, song and controls as one centred group (no stretched gap). */
    .mus { grid-template-rows: auto auto auto; align-content: center; row-gap: min(4cqh, 28px); }
    .w[data-ta="left"] .mus { justify-items: start; text-align: left; } .w[data-ta="left"] #songRow, .w[data-ta="left"] #controls { justify-content: flex-start; }
    .w[data-ta="right"] .mus { justify-items: end; text-align: right; } .w[data-ta="right"] #songRow, .w[data-ta="right"] #controls { justify-content: flex-end; }
  }
  /* Owner, 25 Oct: much smaller album art on Home, so the lyrics get the space (several lines
     instead of one). --as (album art size from the phone) still scales it. */
  @container tile (min-aspect-ratio: 1/1) and (max-aspect-ratio: 13/5) {
    #cover { height: auto; width: calc(min(20cqw, 50cqh) * var(--as, 1)); max-width: none; align-self: center; }
  }
  @container tile (max-aspect-ratio: 1/1) {
    #cover { width: min(calc(min(30cqw, 16cqh) * var(--as, 1)), 22cqh, 40cqw); }
    #line { -webkit-line-clamp: 5; }
    #next { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  }

  /* ================= Any tile size (phone "Edit widgets": 1–12 columns × 1–18 rows) =================
     A tall J7 cell is only ~47 × 44 px and a wide one ~100 × 75 px, so every widget gets size tiers:
     tiny tiles keep only their main value, short strips go one-row, narrow columns stack, and big
     tiles scale text with the tile. Less important parts are dropped whole, never squashed or cut. */

  /* Tiny / one-row tiles: thinner padding so the content gets the room. */
  @container tile (max-width: 130px) or (max-height: 80px) {
    .in { padding: 6px 8px; }
  }

  /* Clock: bigger digits (still fit "12:59 PM"); the date wraps on narrow tiles, drops when there's no room. */
  #time { font-size: max(var(--f14), calc(min(58cqh, 30cqw) * var(--k))); }
  #date { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  @container tile (max-width: 200px) { #date { white-space: normal; line-height: 1.2; } }
  @container tile (max-height: 70px) { #time { font-size: max(var(--f14), calc(min(80cqh, 30cqw) * var(--k))); } #date { display: none; } }
  @container tile (max-width: 70px) { #date { display: none; } }

  /* Info tiles (prayer, weather, football, fuel). */
  .info .ic { font-size: calc(min(44cqh, 20cqw) * var(--k)); }
  .big { font-size: calc(min(36cqh, 13cqw) * var(--k)); }
  .t1 { font-size: max(var(--f16), calc(min(17cqh, 7.5cqw) * var(--k))); }
  .sub { font-size: max(var(--f15), calc(min(16cqh, 7cqw) * var(--k))); }
  /* Long names wrap onto a second line instead of "Arsenal 2 – 1 Liv…". */
  #scoreText, .w[data-w="prayer"] .t1 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2; }
  @container tile (max-aspect-ratio: 1/1) {
    /* Stacked: the icon + text group sits in the middle of the tile (not stuck at the top). */
    .info { justify-content: center; }
    .w[data-ta] .info .txt { flex: none; max-width: 100%; }
    .info .ic { font-size: calc(min(26cqh, 34cqw) * var(--k)); }
    .big { font-size: calc(min(16cqh, 20cqw) * var(--k)); }
    .t1, .sub { font-size: max(var(--f14), calc(min(8cqh, 12cqw) * var(--k))); }
  }
  .info .txt > * { max-width: 100%; }
  /* Narrow row: no icon, the text gets the width (and grows into it). */
  @container tile (max-width: 199px) and (min-aspect-ratio: 1/1) {
    .info .ic { display: none; }

    .ag i { grid-column: auto; grid-row: auto; }
  }
  @container tile (max-height: 80px) and (max-width: 180px) { .ag .at, .ag i { display: none; } .ag { grid-template-columns: minmax(0, 1fr); } }

  /* YouTube: buttons grow with big tiles; quick pages stack on narrow ones; tiny = the search button. */
  .yt { font-size: max(var(--f16), calc(min(9cqh, 5cqw) * var(--k))); }
  .yt button { min-height: max(48px, min(16cqh, 3em)); }
  .yt .yt-c button { font-size: max(var(--f14), .82em); }
  @container tile (max-width: 359px) { .yt-c { flex-direction: column; } }
  @container tile (max-width: 359px) and (max-height: 300px) { .yt-c { flex-direction: row; } .yt-c button:not(#ytHome) { display: none; } }
  @container tile (max-height: 130px) and (max-width: 359px) { .yt-c { display: none; } }
  .yt .yt-c button { padding: 0 .4em; }
  @container tile (max-width: 130px) {
    .yt { align-items: center; }
    .yt .yt-s { padding: 0; width: 100%; justify-content: center; }
    .yt-s span, .yt-c { display: none; }
  }
  @container tile (max-height: 80px) { .yt-c { display: none; } .yt button { min-height: min(48px, calc(100cqh - 12px)); } }
  /* Owner, 26 Oct: up to 5 lyric lines on Home (previous · current · 3 next), smaller text, smaller
     album art and play button. Lines that don't fit the tile are dropped whole by fitLyrics(). */
  #lyr { display: flex; flex-direction: column; gap: .15em; min-height: 0; overflow: hidden; }
  #music > #lyr { flex: 0 1 auto; }
  #lyr > div { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; -webkit-line-clamp: unset;
               line-height: 1.3; font-weight: 500; color: var(--dim); font-size: max(var(--f13), calc(min(4.2cqw, 6cqh) * var(--k))); }
  #lyr > #line { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                 font-weight: 700; color: var(--ink); font-size: max(var(--f15), calc(min(5.4cqw, 7.5cqh) * var(--k))); }
  #lyr > #prevL { opacity: .55; }
  #lyr > .lx:empty, #lyr > .fitHide { display: none !important; }
  .w[data-w="music"] .ctl { width: 44px; height: 44px; min-width: 44px; min-height: 44px; }
  .w[data-w="music"] .ctl.play { width: 54px; height: 54px; min-width: 54px; min-height: 54px; }
  .w[data-w="music"] #cover { width: calc(min(14cqw, 34cqh) * var(--as, 1)); height: auto; max-width: none; align-self: center; flex: none; }
  @container tile (min-aspect-ratio: 13/5) { .w[data-w="music"] #cover { height: auto; width: calc(min(14cqw, 60cqh) * var(--as, 1)); } }
  @container tile (max-aspect-ratio: 1/1) {
    .w[data-w="music"] #cover { width: calc(min(24cqw, 11cqh) * var(--as, 1)); }
    #lyr > div { font-size: max(var(--f13), calc(min(6cqw, 3cqh) * var(--k))); }
    #lyr > #line { font-size: max(var(--f15), calc(min(7.5cqw, 3.8cqh) * var(--k))); }
  }
  @container tile (max-height: 80px) { #lyr { display: none; } }
  .w[data-w="music"] #progress { height: 4px; }
  .w.unsync #lyr > #line { font-weight: 500; color: var(--dim); font-size: max(var(--f13), calc(min(6cqw, 3cqh) * var(--k))); }
  .w.unsync #lyr > #prevL { opacity: 1; color: var(--accent); font-weight: 600; white-space: normal; text-overflow: clip; margin-bottom: .3em; }
  #lyr > .lx.xl { display: none; }
  /* Owner, 26 Oct: tall music card = art, song and artist on top · lyrics fill the middle ·
     buttons at the bottom, with clear space between the three groups. */
  @container tile (max-aspect-ratio: 1/1) and (min-height: 300px) {
    .w[data-w="music"] .mus, .w.noart[data-w="music"] .mus { display: grid; grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "cover" "song" "lyr" "prog" "ctl";
      align-content: stretch; justify-items: center; row-gap: 0; text-align: center; }
    .w[data-w="music"] #music { display: contents; }
    .w[data-w="music"] #cover { grid-area: cover; grid-row: auto; align-self: end; }
    .w[data-w="music"] #songRow { grid-area: song; margin-top: max(8px, 1.6cqh); max-width: 100%; justify-content: center;
      font-size: max(var(--f15), calc(min(6cqw, 2.8cqh) * var(--k))); }
    .w[data-w="music"] #lyr { grid-area: lyr; width: 100%; height: 100%; justify-content: safe center; align-items: center;
      padding: max(14px, 3cqh) 0; box-sizing: border-box; }
    .w[data-w="music"] #lyr > div { max-width: 100%; }
    #lyr > .lx.xl:not(:empty) { display: block; }
    #lyr > .fitHide { display: none !important; }
    .w[data-w="music"] #progress { grid-area: prog; width: 100%; margin: 0 0 max(10px, 2cqh); }
    .w[data-w="music"] #controls { grid-area: ctl; grid-column: auto; align-self: start; justify-content: center; }
  }
  .w[data-w="music"].nodur #progress { display: none; }   /* radio: no song length, no empty bar */
</style>
<script src="dd_tall.js"></script>
</head>
<body>
<div id="plain"></div><div id="photo"></div><div id="bg"></div><div id="dim"></div><div id="shade"></div>
<div id="credit"></div>

<div id="app"><div id="grid">
  <div class="w" data-w="clock"><div class="in shadow"><div id="time">--:--</div><div id="date"></div></div></div>
  <div class="w tile" data-w="prayer"><div class="in info"><span class="ic">🕌</span>
    <div class="txt"><span class="t1 ellipsis"><b id="pName">–</b> <span id="pTime" class="dim"></span></span><span class="big" id="pCount"></span></div></div></div>
  <div class="w tile" data-w="weather"><div class="in info"><span class="ic" id="wIcon">☁️</span>
    <div class="txt"><span class="big" id="wTemp"></span><span id="wDesc" class="sub ellipsis"></span></div></div></div>
  <div class="w tile" data-w="football"><div class="in info"><span class="ic">⚽</span>
    <div class="txt"><span id="scoreText" class="t1 ellipsis"></span><span id="scoreSub" class="sub ellipsis"></span></div></div></div>
  <div class="w tile" data-w="fuel"><div class="in info"><span class="ic">⛽</span>
    <div class="txt"><span id="fuelText" class="sub">Fuel prices…</span></div></div></div>
  <div class="w tile" data-w="music"><div class="in mus">
    <div id="cover">♪</div>
    <div id="music">
      <div id="songRow"><span id="song" class="ellipsis">Waiting for music…</span><span id="artist" class="ellipsis"></span></div>
      <div id="lyr"><div id="prevL" class="lx"></div><div id="line" class="ellipsis"></div><div id="next" class="ellipsis lx"></div><div id="n2" class="lx"></div><div id="n3" class="lx"></div><div id="n4" class="lx xl"></div><div id="n5" class="lx xl"></div><div id="n6" class="lx xl"></div><div id="n7" class="lx xl"></div><div id="n8" class="lx xl"></div><div id="n9" class="lx xl"></div><div id="n10" class="lx xl"></div><div id="n11" class="lx xl"></div><div id="n12" class="lx xl"></div><div id="n13" class="lx xl"></div><div id="n14" class="lx xl"></div></div>
      <div id="progress"><div id="progressFill"></div></div>
    </div>
    <div id="controls">
      <button class="ctl" id="ctlPrev" data-media="prev" aria-label="Previous"></button>
      <button class="ctl play" id="ctlToggle" data-media="toggle" aria-label="Play or pause"></button>
      <button class="ctl" id="ctlNext" data-media="next" aria-label="Next"></button>
    </div>
  </div></div>
  <div class="w tile" data-w="speed"><div class="in spd"><div id="speed">–</div><div id="speedUnit">km/h</div></div></div>
  <div class="w tile" data-w="shortcuts"><div class="in" id="shortcuts"></div></div>
  <div class="w tile" data-w="forecast"><div class="in fc">
    <div id="fcNow"></div><div id="fcHours"></div><div id="fcDays"></div></div></div>
  <div class="w tile" data-w="air"><div class="in aq">
    <div class="tl" id="aqTitle">Air quality</div><div id="aqVal">–</div><div id="aqCat"></div><div id="aqMore"></div></div></div>
  <div class="w tile" data-w="radar"><div class="in"><div id="rdMap"></div><div id="rdDot"></div>
    <div id="rdInfo"></div><div id="rdAttr">© OpenStreetMap · RainViewer</div>
    <div id="rdCtl"><button type="button" data-rdz="1" aria-label="Zoom in">+</button><button type="button" data-rdz="-1" aria-label="Zoom out">−</button><button type="button" data-rdz="0" aria-label="Back to my area">◎</button></div>
    <div id="rdSwitch"><button type="button" data-rdmode="radar">Radar</button><button type="button" data-rdmode="map">Map</button></div></div></div>
  <div class="w tile" data-w="sports"><div class="in sp"><div class="sp-h"><div class="tl" id="spTitle">Sports</div><span class="sp-live" id="spLive"><i></i><span></span></span><div class="cv sp-tabs" id="spTabs"></div></div><div id="spChips"></div><div id="spList"></div></div></div>
  <div class="w tile" data-w="ev"><div class="in evw"><div class="tl" id="evTitle">EV charging nearby</div>
    <div class="ev-b"><div id="evList"></div><div id="evMap"></div></div><div id="evAttr">© Open Charge Map · OpenStreetMap</div></div></div>
  <div class="w tile" data-w="calendar"><div class="in cal"><div id="calHead"></div><div id="calMonth"></div><div id="calStrip"></div><div id="calEvents"></div><div id="calWeek"></div></div></div>
  <div class="w tile" data-w="yt"><div class="in yt">
    <button class="yt-s" data-yt="search"><svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#FF0033"/><path d="M11 6l7 4-7 4z" fill="#fff"/></svg><span id="ytHint">Search YouTube</span></button>
    <div class="yt-c"><button data-yt="/" id="ytHome">Home</button><button data-yt="/feed/subscriptions" id="ytSubs">Subscriptions</button><button data-yt="/feed/history" id="ytHist">History</button></div></div></div>
  <div id="calPop"></div>
</div></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  // Translated labels sent by the app with every update (labels.<key>).
  var L = {}, LANG = 'en';
  var tr = function (k, fallback) { return L[k] || fallback; };

  var state = { lines: [], basePos: 0, baseAt: 0, playing: false, duration: 0, idx: -2, nextEpoch: 0, songKey: '' };

  // ---- Weather (WMO codes) ----
  function weatherOf(code, isDay) {
    if (code === 0) return [isDay ? '☀️' : '🌙', tr('clear', 'Clear')];
    if (code <= 2) return [isDay ? '🌤️' : '☁️', tr('partlyCloudy', 'Partly cloudy')];
    if (code === 3) return ['☁️', tr('cloudy', 'Cloudy')];
    if (code === 45 || code === 48) return ['🌫️', tr('hazy', 'Hazy')];
    if (code >= 51 && code <= 57) return ['🌦️', tr('drizzle', 'Drizzle')];
    if (code >= 61 && code <= 67) return ['🌧️', tr('rain', 'Rain')];
    if (code >= 80 && code <= 82) return ['🌦️', tr('showers', 'Showers')];
    if (code >= 95) return ['⛈️', tr('thunder', 'Thunderstorm')];
    return ['🌥️', tr('cloudy', 'Cloudy')];
  }

  // ---- Clock + prayer countdown (local, every second) ----
  function clock() {
    var d = new Date();
    var hr = d.getHours();
    var tHtml = opt('clock24') === false
      ? ((hr % 12) || 12) + ':' + pad(d.getMinutes()) + '<small class="ap">' + (hr < 12 ? 'AM' : 'PM') + '</small>'
      : pad(hr) + ':' + pad(d.getMinutes());
    if (tHtml !== clock.t) { clock.t = tHtml; $('time').innerHTML = tHtml; }
    var date = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    if (LANG !== 'en') {
      try { date = d.toLocaleDateString(LANG + '-MY', { weekday: 'long', day: 'numeric', month: 'short' }); } catch (_) {}
    }
    var de = $('date'); if (de.textContent !== date) de.textContent = date;
    if (state.nextEpoch) {
      var left = Math.max(0, Math.floor((state.nextEpoch - Date.now()) / 1000));
      var h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = left % 60;
      var pc = (h ? h + ':' + pad(m) : m) + ':' + pad(s);
      var pe = $('pCount'); if (pe.textContent !== pc) pe.textContent = pc;
    }
  }

  // ---- Lyric line (same clock idea as the Lyrics view) ----
  var LEAD = 200;
  function position() {
    var p = state.basePos + (state.playing ? performance.now() - state.baseAt : 0);
    if (state.duration > 0) p = Math.min(p, state.duration);
    return Math.max(0, p);
  }
  function findIndex(pos) {
    var lo = 0, hi = state.lines.length - 1, found = -1;
    while (lo <= hi) { var mid = (lo + hi) >> 1; if (state.lines[mid][0] <= pos) { found = mid; lo = mid + 1; } else hi = mid - 1; }
    return found;
  }
  // Show as many lyric lines as the tile has room for: drop next lines from the bottom first,
  // then the previous line; the current line always stays.
  function fitLyrics() {
    var box = $('lyr'), mus = $('music');
    if (!box || !mus) return;
    var order = ['n14', 'n13', 'n12', 'n11', 'n10', 'n9', 'n8', 'n7', 'n6', 'n5', 'n4', 'n3', 'n2', 'prevL', 'next'];
    order.forEach(function (id) { $(id).classList.remove('fitHide'); });
    for (var k = 0; k < order.length && (mus.scrollHeight > mus.clientHeight + 1 || box.scrollHeight > box.clientHeight + 1); k++) {
      $(order[k]).classList.add('fitHide');
    }
  }
  window.addEventListener('resize', function () { fitLyrics(); });
  function frame() {
    if (!layout.music) { setTimeout(frame, 1000); return; }
    var pos = position();
    if (state.duration > 0) {
      var sx = (pos / state.duration).toFixed(4);
      if (sx !== frame.sx) { frame.sx = sx; $('progressFill').style.transform = 'scaleX(' + sx + ')'; }
    }
    if (state.lines.length && !state.unsynced) {
      var i = findIndex(pos + LEAD);
      if (i !== state.idx) {
        state.idx = i;
        var cur = i >= 0 ? (state.lines[i][1] || '').trim() : '';
        $('line').textContent = cur || '♪';
        var L = function (k) { var x = state.lines[k]; return x ? (x[1] || '').trim() || '♪' : ''; };
        $('prevL').textContent = i >= 1 ? L(i - 1) : '';
        $('next').textContent = L(i + 1);
        $('n2').textContent = L(i + 2);
        $('n3').textContent = L(i + 3);
        for (var q = 4; q <= 14; q++) $('n' + q).textContent = L(i + q);
        fitLyrics();
      }
    }
    // 10 fps is plenty for a progress bar + line swap; idle at 1 fps when the Music widget is off.
    setTimeout(frame, layout.music ? 100 : 1000);
  }


  var ICON = {
    prev: '<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>'
  };
  var isPlaying = false;
  function setPlayIcon(playing) {
    isPlaying = playing;
    var b = document.getElementById('ctlToggle');
    if (b) b.innerHTML = playing ? ICON.pause : ICON.play;
  }
  function initControls() {
    document.getElementById('ctlPrev').innerHTML = ICON.prev;
    document.getElementById('ctlNext').innerHTML = ICON.next;
    setPlayIcon(false);
    Array.prototype.forEach.call(document.querySelectorAll('[data-media]'), function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-media');
        if (a === 'toggle') setPlayIcon(!isPlaying);   // flip now; the app's state follows
        if (window.AutoDeck && window.AutoDeck.media) window.AutoDeck.media(a);
      });
    });
  }

  // Phone Settings "Speedometer unit" saves speedMph on the layout (false/missing = km/h).
  var lastSpeed = null, lastGps = false;
  function setSpeed(kmh, gps) {
    lastSpeed = kmh; lastGps = gps;
    var mph = opt('speedMph') === true;
    $('speed').textContent = gps && kmh != null ? (mph ? Math.round(kmh * 0.621371) : kmh) : '–';
    $('speedUnit').textContent = gps ? (mph ? 'mph' : 'km/h') : tr('noGps', 'no GPS');
  }

  function renderMusic(m) {
    if (!m) return;
    var waiting = !m.title;
    $('song').textContent = waiting ? tr('waiting', 'Waiting for music…') : m.title;
    $('artist').textContent = m.artist || '';
    // Re-sent with every update; only repaint (re-decode + 42px blur) when it changes.
    if ('art' in m && m.art !== state.art) {
      state.art = m.art;
      var art = m.art ? 'url("' + m.art + '")' : '';
      $('cover').style.backgroundImage = art;
      $('cover').textContent = m.art ? '' : '♪';
      // A station badge (no album cover found) is shown on the card only; the background stays plain.
      var realArt = m.art && m.art.indexOf('data:image/svg') !== 0;
      $('bg').style.backgroundImage = realArt ? art : '';
      document.body.classList.toggle('art', !!realArt);
    }
    var transit = m.sentAtMs ? Math.min(Math.max(0, Date.now() - m.sentAtMs), 1500) : 0;
    // delayMs: the car plays the sound a little after the phone's clock (set on the Lyrics page).
    state.basePos = (m.positionMs || 0) - (m.delayMs || 0) + (m.playing ? transit : 0);
    state.baseAt = performance.now();
    state.playing = !!m.playing;
    setPlayIcon(state.playing);
    state.duration = m.durationMs || 0;
    var mw = document.querySelector('.w[data-w="music"]'); if (mw) mw.classList.toggle('nodur', !(state.duration > 0));
    var key = (m.title || '') + '|' + (m.lines ? m.lines.length : 0) + '|' + (m.unsynced ? 'u' : 's');
    state.unsynced = !!m.unsynced;
    if (key !== state.songKey) {
      state.songKey = key;
      state.lines = m.lines || [];
      state.idx = -2;
      ['prevL', 'next', 'n2', 'n3', 'n4', 'n5', 'n6', 'n7', 'n8', 'n9', 'n10', 'n11', 'n12', 'n13', 'n14'].forEach(function (id) { $(id).textContent = ''; });
      var mw2 = document.querySelector('.w[data-w="music"]');
      if (mw2) mw2.classList.toggle('unsync', state.unsynced && state.lines.length > 0);
      if (state.unsynced && state.lines.length) {
        // Tuned in mid-song: the lyrics can't be timed, so show them plainly (no moving highlight)
        // until the next song starts.
        $('prevL').textContent = tr('syncNext', 'Tuned in mid-song · lyrics follow along from the next song');
        var T = function (k) { var x = state.lines[k]; return x ? (x[1] || '').trim() || '♪' : ''; };
        $('line').textContent = T(0);
        $('next').textContent = T(1); $('n2').textContent = T(2); $('n3').textContent = T(3);
        for (var q = 4; q <= 14; q++) $('n' + q).textContent = T(q);
        fitLyrics();
      }
      if (!state.lines.length) {
        $('line').textContent = waiting ? (m.app ? '' : tr('playSomething', 'Play something in Spotify')) :
          ({ loading: tr('findingLyrics', 'Finding lyrics…'), notFound: m.playing ? '♪' : tr('paused', 'Paused'),
             instrumental: tr('instrumental', 'Instrumental'), offline: tr('offline', 'Offline') }[m.status] || '♪');
      }
    }
  }

  function renderPrayer(p) {
    var next = p && p.next;
    if (!next) { state.nextEpoch = 0; $('pName').textContent = '–'; $('pTime').textContent = ''; $('pCount').textContent = ''; return; }
    $('pName').textContent = next.name;
    $('pTime').textContent = next.time;
    state.nextEpoch = next.epochMs;
  }

  function renderWeather(w) {
    if (!w) return;
    var wi = weatherOf(w.code, w.isDay);
    $('wIcon').textContent = w.rain ? '☔' : wi[0];
    var tVal = w.temp != null ? parseFloat(w.temp) : 31;
    $('wTemp').textContent = (!isNaN(tVal) ? Math.round(tVal) : 31) + '°';
    $('wDesc').textContent = w.rain || wi[1];
  }

  function renderScores(label, list) {
    var m = list && list[0];
    if (!m) { $('scoreText').textContent = tr('noLiveMatch', 'No live match'); $('scoreSub').textContent = ''; return; }
    $('scoreText').textContent = m.home + ' ' + (m.score || 'vs') + ' ' + m.away;
    // A running minute / half-time / LIVE = game in progress: red dot + text, not just a number.
    var live = /^(\d+(\+\d+)?'|HT|LIVE|IN PLAY)/i.test(m.status || '');
    $('scoreSub').innerHTML = (live ? '<span class="lv">● ' + esc(tr('live', 'Live')) + '</span> ' : '') + esc(m.status || '') +
      (list.length > 1 ? '  +' + (list.length - 1) : '');
  }

  function renderFuel(f) {
    if (!f || !f.items) return;
    // One column per fuel: name above, price below (prices line up and never wrap mid-item).
    $('fuelText').innerHTML = f.items.filter(function (i) { return i.label !== 'RON95'; }).map(function (i) {
      return '<span class="fu"><small>' + esc(i.label.replace('RON95 BUDI', 'RON95')) + '</small><b>' + Number(i.price).toFixed(2) + '</b></span>';
    }).join('');
  }

  var bgUrl = null;
  function tallBgUrl(u) {
    if (!isTallScreen() || u.indexOf('images.unsplash.com') < 0) return u;
    try {
      var x = new URL(u);
      x.searchParams.set('w', '1080'); x.searchParams.set('h', '1920');
      x.searchParams.set('fit', 'crop'); x.searchParams.set('crop', 'entropy');
      return x.toString();
    } catch (e) { return u; }
  }
  function renderBg(b) {
    b = b || { mode: 'cover', dim: .35 };
    document.body.className = document.body.className.replace(/\bmode-\w+/g, '').trim() + ' mode-' + b.mode;
    $('dim').style.opacity = b.mode === 'plain' ? 0 : (b.dim == null ? .35 : b.dim);
