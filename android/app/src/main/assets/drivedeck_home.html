    cols.forEach(function (c, i) {
      h += '<div class="wk-col' + (i === 0 && n > 1 ? ' td' : '') + (c.we && n > 1 ? ' we' : '') + '">' +
        (i === 0 && nowPct >= 0 && nowPct <= 100 ? '<div class="wk-now" style="top:' + nowPct + '%"></div>' : '');
      // shortcut: overlapping events stack on top of each other; add side-by-side columns if people have busy calendars.
      c.timed.forEach(function (e) {
        var b = new Date(e.begin), en = new Date(e.end);
        var top = Math.max(0, (b.getHours() + b.getMinutes() / 60 - h0) / span * 100);
        var bot = Math.min(100, ((en - c.start) / 36e5 - h0) / span * 100);
        h += block(e, 'top:' + top + '%;height:' + Math.max(4, bot - top) + '%;');
      });
      h += '</div>';
    });
    $('calWeek').innerHTML = h + '</div>';
  }

  // "Next: Meeting · in 45 min" chip for the week header.
  function nextChip(evs, now) {
    var n = evs.filter(function (e) { return !e.allDay && e.begin > now.getTime(); })
      .sort(function (a, b) { return a.begin - b.begin; })[0];
    if (!n) return '';
    var mins = Math.round((n.begin - now.getTime()) / 6e4), b = new Date(n.begin);
    var when = mins < 60 ? tr('inMin', 'in') + ' ' + mins + ' min' : mins < 1440 && b.getDate() === now.getDate() ? pad(b.getHours()) + ':' + pad(b.getMinutes())
      : WD[b.getDay()] + ' ' + pad(b.getHours()) + ':' + pad(b.getMinutes());
    return '<div class="wk-nx"><i style="background:' + esc(n.color || '#5EF2D6') + '"></i><span>' + esc(n.title) + '</span><em>' + esc(when) + '</em></div>';
  }

  // ---- Event details popup ----
  var calAll = [], popTimer = null;
  function fmtRange(e) {
    var loc = LANG === 'en' ? 'en-MY' : LANG + '-MY', b = new Date(e.begin), en = new Date(e.end);
    var day = b.toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' });
    if (e.allDay) return [day, tr('allDay', 'All day')];
    var mins = Math.round((e.end - e.begin) / 6e4), dur = mins >= 60 ? Math.floor(mins / 60) + 'h' + (mins % 60 ? ' ' + mins % 60 + 'm' : '') : mins + 'm';
    return [day, pad(b.getHours()) + ':' + pad(b.getMinutes()) + ' – ' + pad(en.getHours()) + ':' + pad(en.getMinutes()) + '  ·  ' + dur];
  }
  function closePop() { $('calPop').className = ''; $('calPop').innerHTML = ''; clearTimeout(popTimer); }
  function openPop(html, color) {
    $('calPop').innerHTML = '<div class="cp"><div class="cp-bar" style="background:' + esc(color || '#5EF2D6') + '"></div><div class="cp-in">' + html + '</div></div>';
    $('calPop').className = 'on';
    clearTimeout(popTimer);
    popTimer = setTimeout(closePop, 20000);   // never left over the screen while driving
  }
  function showEvent(e) {
    var now = Date.now(), r = fmtRange(e), live = !e.allDay && e.begin <= now && e.end > now;
    // Notes may hold HTML from Google invites: show as plain text only.
    var notes = (e.notes || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').trim();
    openPop('<div class="cp-top"><b>' + esc(e.title || '—') + '</b><button class="cp-x" data-close>✕</button></div>' +
      (live ? '<span class="cp-now">' + esc(tr('happeningNow', 'Happening now')) + '</span>' : '') +
      '<div class="cp-row"><i>🗓</i><span>' + esc(r[0]) + '<br><span class="sub">' + esc(r[1]) + '</span></span></div>' +
      (e.where ? '<div class="cp-row"><i>📍</i><span>' + esc(e.where) + '</span></div>' : '') +
      (e.calendar ? '<div class="cp-row"><i style="color:' + esc(e.color || '#5EF2D6') + '">●</i><span class="sub">' + esc(e.calendar) + '</span></div>' : '') +
      (notes ? '<div class="cp-notes">' + esc(notes) + '</div>' : ''), e.color);
  }
  function showDay(ms) {
    var d = new Date(+ms), loc = LANG === 'en' ? 'en-MY' : LANG + '-MY';
    var list = calAll.filter(function (e) { return new Date(e.begin).toDateString() === d.toDateString(); });
    openPop('<div class="cp-top"><b>' + esc(d.toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' })) +
      '</b><button class="cp-x" data-close>✕</button></div>' + (list.length ? '<div class="cp-list">' + list.map(function (e) {
        var b = new Date(e.begin);
        return '<div class="cp-li" data-ev="' + calAll.indexOf(e) + '"><i style="background:' + esc(e.color || '#5EF2D6') + '"></i><span class="tm">' +
          (e.allDay ? esc(tr('allDay', 'All day')) : pad(b.getHours()) + ':' + pad(b.getMinutes())) + '</span><span>' + esc(e.title) + '</span></div>';
      }).join('') + '</div>' : '<div class="cp-row"><span class="sub">' + esc(tr('noEventsDay', 'No events')) + '</span></div>'));
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t.closest) return;
    if (t.closest('[data-close]') || t.id === 'calPop') { closePop(); return; }
    var a = t.closest('[data-ev]');
    if (a && calAll[+a.getAttribute('data-ev')]) { showEvent(calAll[+a.getAttribute('data-ev')]); return; }
    var d = t.closest('[data-day]');
    if (d) showDay(d.getAttribute('data-day'));
  });

  // ---- EV charging ----
  var evKey = null;
  // Who can charge here, in words (colour only repeats it): red = can't use, amber = conditions.
  function evAccess(c) {
    if (c.status === 'down') return '<span class="acc no">' + esc(tr('evOffline', 'Out of service')) + '</span>';
    if (c.access === 'restricted') return '<span class="acc no">' + esc(tr('evRestricted', 'Restricted')) + '</span>';
    if (c.access === 'members') return '<span class="acc mb">' + esc(tr('evMembers', 'Members')) + '</span>';
    return '';
  }
  function renderEv(e) {
    if (!on('ev')) return;
    $('evTitle').textContent = tr('evTitle', 'EV charging nearby');
    var items = (e && e.items) || [];
    if (!items.length) { $('evList').innerHTML = '<div class="na">' + esc(tr('noChargers', 'No chargers found nearby')) + '</div>'; $('evMap').textContent = ''; return; }
    $('evList').innerHTML = items.map(function (c, i) {
      var km = c.km == null ? '' : c.km < 1 ? Math.round(c.km * 1000) + ' m' : c.km.toFixed(1) + ' km';
      var plugs = (c.plugs || []).slice(0, 3).map(function (p) {
        return '<span class="plug' + (p.kw >= 40 ? ' fast' : '') + '">' + esc(p.type) + (p.kw ? ' ' + p.kw + 'kW' : '') + (p.n > 1 ? ' ×' + p.n : '') + '</span>';
      }).join('');
      return '<div class="ch' + (c.status === 'down' ? ' down' : '') + '" data-nav-lat="' + c.lat + '" data-nav-lng="' + c.lng + '"><span class="n">' + (i + 1) +
        '</span><span class="nm"><b>' + esc(c.name) + '</b>' + evAccess(c) + '</span><span class="km">' + km + '</span><span class="sub">' + plugs +
        (c.operator || c.kind ? '<span class="op">' + esc([c.operator, c.kind].filter(Boolean).join(' · ')) + '</span>' : '') + '</span></div>';
    }).join('');
    renderEvMap(e);
  }
  // Map only when the tile is big enough (CSS shows #evMap); tiles + numbered pins, rebuilt only when data or size changes.
  function renderEvMap(e) {
    var box = $('evMap'), W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var key = JSON.stringify(e.items.map(function (c) { return [c.lat, c.lng]; })) + W + 'x' + H;
    if (key === evKey) return;
    evKey = key;
    var lats = e.items.map(function (c) { return c.lat; }).concat([e.lat]), lngs = e.items.map(function (c) { return c.lng; }).concat([e.lng]);
    var span = Math.max(Math.max.apply(null, lats) - Math.min.apply(null, lats), Math.max.apply(null, lngs) - Math.min.apply(null, lngs), .01);
    var z = Math.max(8, Math.min(15, Math.floor(Math.log2(360 * Math.min(W, H) / 256 / span / 1.4))));
    var n = Math.pow(2, z), px = function (lat, lng) {
      var r = lat * Math.PI / 180;
      return [(lng + 180) / 360 * n * 256, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n * 256];
    };
    var c = px((Math.max.apply(null, lats) + Math.min.apply(null, lats)) / 2, (Math.max.apply(null, lngs) + Math.min.apply(null, lngs)) / 2);
    var ox = W / 2 - c[0], oy = H / 2 - c[1], h = '';
    for (var ty = Math.floor(-oy / 256); ty * 256 + oy < H; ty++) for (var tx = Math.floor(-ox / 256); tx * 256 + ox < W; tx++) {
      if (ty < 0 || ty >= n) continue;
      h += '<img src="https://tile.openstreetmap.org/' + z + '/' + (((tx % n) + n) % n) + '/' + ty + '.png" style="left:' + (tx * 256 + ox) + 'px;top:' + (ty * 256 + oy) + 'px" onerror="this.remove()">';
    }
    var me = px(e.lat, e.lng);
    h += '<span class="me" style="left:' + (me[0] + ox) + 'px;top:' + (me[1] + oy) + 'px"></span>';
    e.items.forEach(function (it, i) {
      var p = px(it.lat, it.lng);
      h += '<span class="pin' + (it.status === 'down' || it.access === 'restricted' ? ' no' : '') + '" style="left:' + (p[0] + ox) + 'px;top:' + (p[1] + oy) + 'px">' + (i + 1) + '</span>';
    });
    box.innerHTML = h;
  }
  document.addEventListener('click', function (ev) {
    var y = ev.target.closest && ev.target.closest('[data-yt]');
    if (y && window.AutoDeck && window.AutoDeck.youtube) window.AutoDeck.youtube(y.getAttribute('data-yt'));
    var c = ev.target.closest && ev.target.closest('[data-nav-lat]');
    if (c && window.AutoDeck && window.AutoDeck.navigate) window.AutoDeck.navigate(+c.getAttribute('data-nav-lat'), +c.getAttribute('data-nav-lng'));
    // A tap on a Home card opens that card's own page (owner, 25 Oct: never Waze from a card).
    // Taps on a card's own controls (buttons, tabs, links, calendar days...) keep doing their job.
    if (y || c) return;
    if (ev.target.closest('button, a, input, select, textarea, [data-sptab], [data-spcomp], [data-cv], [data-ev], [data-day], [data-close], [data-yt], .ctl, [onclick]')) return;
    var tile = ev.target.closest('.w.tile');
    if (!tile || document.body.classList.contains('editing')) return;
    var CARD_PAGE = { prayer: 'prayer', music: 'lyrics', weather: 'custom:weather', forecast: 'custom:weather',
      air: 'custom:weather', radar: 'custom:radar', football: 'custom:sports', sports: 'custom:sports',
      calendar: 'custom:calendar', ev: 'custom:ev' };
    var target = CARD_PAGE[tile.getAttribute('data-w')];
    if (tile.getAttribute('data-w') === 'radar' && tile.classList.contains('mapmode')) return;   // the map itself takes taps
    if (!target || !window.AutoDeck || !window.AutoDeck.page) return;
    // Already showing that page (e.g. a card on the Custom page itself): nothing to do.
    if (target.indexOf('custom:') === 0 && document.body.classList.contains('pg-custom')) return;
    window.AutoDeck.page(target);
  });

  var extras = {}, rainNote = null;
  function renderExtras() {
    renderForecast(extras.forecast); renderAir(extras.air); renderRadar(extras.radar);
    renderSports(extras.sports); renderCalendar(extras.calendar); renderEv(extras.ev);
    $('ytHint').textContent = tr('ytSearch', 'Search YouTube'); $('ytHome').textContent = tr('ytHome', 'Home');
    $('ytSubs').textContent = tr('ytSubs', 'Subscriptions'); $('ytHist').textContent = tr('ytHistory', 'History');
  }

  /** Called from Kotlin with the JSON payload built in Dart. */
  window.ddUpdate = function (p) {
    if (typeof p === 'string') p = JSON.parse(p);
    if (p && p.layoutMode && window.ddSetLayoutMode) window.ddSetLayoutMode(p.layoutMode);   // Always tall / Automatic
    setSpeed(p.speed, p.gps);
    if (p.speedOnly) return;
    if (p.labels) L = p.labels;
    if (p.lang) LANG = p.lang;
    // The Custom page (forecast / air / radar) sends its own fixed layout under p.layout.
    customLayout = (p.page === 'custom' && p.layout && p.layout.widgets) ? p.layout : null;
    if (!customLayout && p.layout && p.layout.widgets && p.layout.widgets.length > 0) {
      layoutLand = p.layout;
    }
    if (p.layoutP) layoutPort = p.layoutP;
    applyLayout(pickLayout());
    document.body.classList.add('ready');
    renderBg(p.bg);
    renderMusic(p.music);
    renderPrayer(p.prayer);
    renderWeather(p.weather);
    renderScores(p.scoresLabel || 'Today', p.scores);
    if (p.fuel == null) $('fuelText').textContent = tr('fuelLoading', 'Fuel prices…');
    renderFuel(p.fuel);
    ['forecast', 'air', 'radar', 'sports', 'calendar', 'football', 'ev'].forEach(function (k) { extras[k] = p[k]; });
    rainNote = p.weather && p.weather.rain;
    document.body.classList.toggle('pg-custom', p.page === 'custom');
    document.body.className = document.body.className.replace(/\bfn-\w+/g, '').trim() + (p.fn ? ' fn-' + p.fn : '');
    renderExtras();
    clock();
  };
  window.ddRelayout = function () { state.idx = -2; };


  initControls();
  // Tiles stay hidden until the phone's data arrives (pushed right after load), so a
  // default layout never flashes first. Fallback if nothing comes: the default template.
  setTimeout(function () { if (!document.body.classList.contains('ready')) { applyLayout(null); document.body.classList.add('ready'); } }, 1500);
  clock();
  setInterval(clock, 1000);
  frame();
})();
</script>
