<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script>(function(){var q=/[?&]theme=(dark|light)/.exec(location.search),m=q&&q[1];
try{if(!m&&window.AutoDeck&&AutoDeck.theme)m=AutoDeck.theme();}catch(e){}
if(!m)m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=m;
window.ddTheme=function(t){document.documentElement.dataset.theme=(t==='dark'?'dark':'light');};})();</script>
<style>
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --surface-2: #F1F5F9; --border: #E2E8F0;
    --ink: #0F172A; --ink-2: #475569; --ink-3: #64748B;
    --accent: #0F766E; --on-accent: #FFFFFF; --danger: #DC2626; --ok: #15803D;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.06);
    --wash: 86%;                         /* how much page colour covers the song cover */
    --teal: var(--accent); --violet: var(--accent); --night: var(--bg);
  }
  :root[data-theme="dark"] {
    --bg: #0F1115; --surface: #181B21; --surface-2: #20242B; --border: #2A2F37;
    --ink: #F1F5F9; --ink-2: #A3ACB9; --ink-3: #7C8594;
    --accent: #2DD4BF; --on-accent: #042F2E; --danger: #F87171; --ok: #4ADE80;
    --shadow: none;
    --wash: 85%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Google Sans", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Song cover behind everything, washed with the page colour so text reads in both themes (no blur). */
  #bg {
    position: fixed; inset: 0;
    background: var(--bg) center/cover no-repeat;
  }
  #shade {
    position: fixed; inset: 0;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--bg) calc(var(--wash) + 6%), transparent) 0%,
      color-mix(in srgb, var(--bg) var(--wash), transparent) 45%,
      color-mix(in srgb, var(--bg) calc(var(--wash) + 8%), transparent) 100%);
  }

  #app {
    position: relative; height: 100%;
    display: grid; grid-template-columns: 36% 1fr; gap: 4vw;
    padding: calc(4.5vh + var(--dd-extra, 0px)) 5vw 4.5vh;
  }
  /* Compact "now playing card" for Android Auto's split panes and small screens. */
  @media (max-aspect-ratio: 13/10), (max-width: 620px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 2.4vh; padding: calc(4.5vh + var(--dd-extra, 0px)) 5vw 4.5vh; }
    #side { flex-direction: row; align-items: center; gap: 4vw; justify-content: flex-start; }
    #cover { width: 17vh !important; max-width: 17vh; flex: none; border-radius: 2.2vh; }
    #title { font-size: 6vh; }
    #artist { font-size: 4.2vh; }
    .chip { font-size: 3vh; }
    #progress { display: none; }
    #controls { margin-left: auto; gap: 1.6vh; }
    .ctl { width: max(48px, 9vh); height: max(48px, 9vh); }
    .ctl.play { width: max(56px, 11vh); height: max(56px, 11vh); }
    #stage {
      -webkit-mask-image: linear-gradient(transparent 0%, #000 12%, #000 72%, transparent 100%);
              mask-image: linear-gradient(transparent 0%, #000 12%, #000 72%, transparent 100%);
    }
    .line { font-size: 8.5vh; padding: 1.2vh 0; }
    .line.past { opacity: .75; }
    #plain { font-size: 5.5vh; }
    #message { font-size: 6vh; }
  }
  /* Left: cover + track info */
  #side { display: flex; flex-direction: column; justify-content: center; gap: 2.4vh; min-width: 0; }
  #cover {
    width: 100%; max-width: 44vh; aspect-ratio: 1; border-radius: 2.8vh;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--surface-2)), var(--surface-2)) center/cover;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  #meta { min-width: 0; }
  #title { font-size: 5.4vh; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  #artist { font-size: 3.8vh; color: var(--ink-2); margin-top: .8vh; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chips { display: flex; gap: 1.2vh; margin-top: 1.8vh; flex-wrap: wrap; }
  .chip {
    font-size: 2.4vh; font-weight: 600; padding: .6vh 1.6vh; border-radius: 99px; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid var(--border);
  }
  /* Lyrics Earlier / Later: lines up the lyrics with the car's sound (saved for next time). */
  #sync { display: flex; align-items: center; gap: 1vh; margin-top: 1.4vh; }
  #sync button { font: inherit; font-size: 2.3vh; font-weight: 600; min-height: 44px; padding: .5vh 1.8vh; border-radius: 99px;
                 border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer;
                 touch-action: none; user-select: none; -webkit-user-select: none; }
  #syncHint { font-size: 1.9vh; color: var(--ink-3); margin-top: .6vh; }
  #syncVal { font-size: 2.2vh; color: var(--ink-2); min-width: 9vh; text-align: center; font-variant-numeric: tabular-nums; }
  .chip.live { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  #progress { height: .9vh; min-height: 4px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  /* Progress grows with transform (compositor only); JS sets scaleX each frame. */
  #bar { height: 100%; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left center; }

  /* Player buttons */
  #controls { display: flex; align-items: center; gap: 2.4vh; }
  .ctl { width: max(48px, 8.5vh); height: max(48px, 8.5vh); border-radius: 50%; border: 1px solid var(--border);
         background: var(--surface); box-shadow: var(--shadow);
         display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: none; transition: transform .15s ease; }
  .ctl svg { width: 46%; height: 46%; fill: var(--ink); }
  .ctl.play { width: max(56px, 11vh); height: max(56px, 11vh); background: var(--accent); border-color: var(--accent); }
  .ctl.play svg { width: 48%; height: 48%; fill: var(--on-accent); }
  .ctl:active { transform: scale(.92); }

  /* Right: lyrics */
  #stage {
    position: relative; overflow: hidden; min-width: 0;
    -webkit-mask-image: linear-gradient(transparent 0%, #000 15%, #000 78%, transparent 100%);
            mask-image: linear-gradient(transparent 0%, #000 15%, #000 78%, transparent 100%);
  }
  #lines {
    position: absolute; left: 0; right: 0; top: 0;
    transition: transform .25s cubic-bezier(.22,.61,.36,1);
    will-change: transform;
  }
  /* Colour is set per state without a transition; only transform + opacity animate. */
  .line {
    font-size: 6.2vh; font-weight: 800; line-height: 1.35;
    padding: 1.5vh 0; color: var(--ink-3);
    transform-origin: left center;
    transform: scale(.84);
    opacity: .9;
    transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1), opacity .25s ease;
  }
  .line.next { opacity: 1; transform: scale(.9); }
  .line.past { opacity: .75; }
  .line.now {
    transform: scale(1.05); opacity: 1; color: var(--ink); font-weight: 900;
  }
  .line.gap { font-size: 5vh; letter-spacing: .4em; }

  #plain { font-size: 4.8vh; line-height: 1.6; white-space: pre-wrap; color: var(--ink); padding: 14vh 2vw; }

  #message {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-size: 5.2vh; font-weight: 700; color: var(--ink); padding: 0 4vw;
  }
  #message small { display: block; font-size: 3.2vh; font-weight: 400; color: var(--ink-2); margin-top: 1.4vh; }
  .eq { display: inline-flex; gap: .6vh; height: 4vh; align-items: flex-end; margin-bottom: 2vh; }
  .eq i { width: .9vh; height: 100%; background: var(--accent); border-radius: 1vh; transform-origin: bottom; animation: eq 1s infinite ease-in-out; }
  .eq i:nth-child(2) { animation-delay: .2s; opacity: .8; }
  .eq i:nth-child(3) { animation-delay: .4s; opacity: .6; }
  @keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }

  /* Tall head units (Jaecoo J7 portrait): song card on top, centred controls, lyrics below.
     Comes last so it wins over the base rules; sizes follow the width and are clamped for big screens.
     Top padding clears the dock bar (16 dp margin + ~56 dp bar). */
  @media (max-aspect-ratio: 4/5) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: clamp(16px, 2.6vh, 56px);
           padding: calc(clamp(84px, 5.5vh, 140px) + var(--dd-extra, 0px)) 6vw clamp(20px, 3vh, 64px); }
    #side { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "cover meta" "progress progress" "controls controls";
            align-items: center; column-gap: 5vw; row-gap: clamp(16px, 2.4vh, 48px); }
    #cover { grid-area: cover; width: clamp(110px, 28vw, 400px) !important; max-width: none; border-radius: clamp(14px, 3vw, 36px); }
    #meta { grid-area: meta; }
    #title { font-size: clamp(26px, 6.4vw, 80px); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    #artist { font-size: clamp(18px, 4.4vw, 54px); margin-top: .3em; }
    #chips { gap: clamp(8px, 1.6vw, 18px); margin-top: clamp(10px, 1.6vh, 28px); }
    .chip { font-size: clamp(14px, 3vw, 34px); padding: .3em .9em; }
    #progress { display: block; grid-area: progress; height: clamp(6px, 1vw, 14px); }
    #controls { grid-area: controls; justify-content: center; gap: clamp(24px, 8vw, 110px); margin-left: 0; }
    .ctl { width: clamp(64px, 15vw, 128px); height: clamp(64px, 15vw, 128px); }
    .ctl.play { width: clamp(84px, 20vw, 168px); height: clamp(84px, 20vw, 168px); }
    #stage {
      -webkit-mask-image: linear-gradient(transparent 0%, #000 10%, #000 80%, transparent 100%);
              mask-image: linear-gradient(transparent 0%, #000 10%, #000 80%, transparent 100%);
    }
    /* Centred lines, padded so the 1.05× "now" line never gets cut at the edges. */
    .line { font-size: clamp(26px, min(7.2vw, 4.4vh), 92px); padding: .22em 4vw; text-align: center; transform-origin: center; }
    .line.gap { font-size: clamp(22px, 5.6vw, 72px); }
    #plain { font-size: clamp(20px, 5vw, 60px); padding: 8vh 4vw; text-align: center; }
    #message { font-size: clamp(22px, 6vw, 72px); }
    #message small { font-size: clamp(16px, 4vw, 44px); }
    /* Sooner / Later on one line each (vh sizes wrapped "◀ Sooner" onto two lines on the J7). */
    #sync { flex-wrap: wrap; gap: clamp(6px, 1.4vw, 16px); }
    #sync button { font-size: clamp(14px, 3vw, 34px); padding: .35em .9em; white-space: nowrap; }
    #syncVal { font-size: clamp(13px, 2.8vw, 30px); min-width: 3.4em; }
    #syncHint { font-size: clamp(12px, 2.5vw, 28px); }
  }
  /* Small Android Auto split-screen panel (e.g. 460×370): one compact row (cover · song · buttons) below
     the floating dock bar (16 dp + 46 dp), lyrics underneath. */
  @media (max-width: 619px) and (max-aspect-ratio: 27/20) and (min-aspect-ratio: 20/21) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: calc(70px + var(--dd-extra, 0px)) 16px 12px; }
    #side { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "cover meta controls";
            align-items: center; column-gap: 12px; }
    #cover { grid-area: cover; width: 56px !important; max-width: none; border-radius: 12px; }
    #meta { grid-area: meta; }
    #title { font-size: 18px; }
    #artist { font-size: 14px; margin-top: 2px; }
    #chips { display: none; }
    #progress { display: none; }
    #controls { grid-area: controls; gap: 8px; margin-left: 0; }
    .ctl { width: 48px; height: 48px; }
    .ctl.play { width: 56px; height: 56px; }
    .line { font-size: 24px; padding: 4px 0; }
    .line.gap { font-size: 20px; }
    #plain { font-size: 18px; padding: 40px 0; }
    #message { font-size: 20px; }
    #message small { font-size: 15px; }
  }
</style>
<!-- Lyrics follow the real screen shape (tall on the J7); forcing tall on a wide screen pushed the lines off it. -->
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div id="app">
  <div id="side">
    <div id="cover"></div>
    <div id="meta">
      <div id="title">DashMate</div>
      <div id="artist">Waiting for music…</div>
      <div id="chips"></div>
      <div id="sync"><button type="button" data-delay="-500" aria-label="Show lyrics sooner (hold to keep going, up to 15 s)">◀ Sooner</button><span id="syncVal"></span><button type="button" data-delay="500" aria-label="Show lyrics later (hold to keep going, up to 15 s)">Later ▶</button></div>
      <div id="syncHint">Lyrics ahead of the singer? Tap Later.</div>
    </div>
    <div id="progress"><div id="bar"></div></div>
    <div id="controls">
      <button class="ctl" id="ctlPrev" data-media="prev" aria-label="Previous"></button>
      <button class="ctl play" id="ctlToggle" data-media="toggle" aria-label="Play or pause"></button>
      <button class="ctl" id="ctlNext" data-media="next" aria-label="Next"></button>
    </div>
  </div>
  <div id="stage">
    <div id="lines"></div>
    <div id="plain" style="display:none"></div>
    <div id="message"></div>
  </div>
</div>
<script>
(function () {
  var lastArt;
  var state = {
    lines: [],          // [[ms, text], ...]
    plain: '',
    key: '',
    basePos: 0, baseAt: 0, playing: false, duration: 0,
    index: -2
  };
  var $ = function (id) { return document.getElementById(id); };
  var linesEl = $('lines'), plainEl = $('plain'), msgEl = $('message'), stage = $('stage');

  // Translated labels sent by the app with every update.
  var L = {};
  var tr = function (k, fallback) { return L[k] || fallback; };
  function messages() {
    return {
      waiting: [tr('waiting', 'Waiting for music…'), tr('playSomethingAny', 'Play something in Spotify, YouTube Music or any app')],
      access: [tr('allowAccess', 'Allow notification access'), tr('allowAccessHint', 'Open DashMate on your phone to grant it')],
      loading: ['<span class="eq"><i></i><i></i><i></i></span><br>' + escapeHtml(tr('findingLyrics', 'Finding lyrics…')), ''],
      notFound: [escapeHtml(tr('noLyricsFound', 'No lyrics found')), ''],
      instrumental: ['♪ ' + escapeHtml(tr('instrumental', 'Instrumental')) + ' ♪', ''],
      offline: [escapeHtml(tr('offline', 'Offline')), '']
    };
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  // Clock: basePos at baseAt, advancing while playing. Small resync errors are
  // glided in over SLEW_MS instead of snapping, so lines never jitter.
  var SLEW_MS = 800;      // how long a small correction takes
  var SNAP_MS = 1200;     // bigger differences (seek, skip) jump immediately
  var LEAD_MS = 200;      // light lines up slightly early, like karaoke

  function rawPosition(now) {
    var p = state.basePos;
    if (state.playing) p += now - state.baseAt;
    if (state.slew) p += state.slew * Math.min(1, (now - state.slewAt) / SLEW_MS);
    return p;
  }


  var ICON = {
    prev: '<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>'
  };
  var isPlaying = false;
  function setPlayIcon(playing) {
    isPlaying = playing;
    var b = document.getElementById('ctlToggle');
    if (b) b.innerHTML = playing ? ICON.pause : ICON.play;
  }
  function initControls() {
    document.getElementById('ctlPrev').innerHTML = ICON.prev;
    document.getElementById('ctlNext').innerHTML = ICON.next;
    setPlayIcon(false);
    Array.prototype.forEach.call(document.querySelectorAll('[data-media]'), function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-media');
        if (a === 'toggle') setPlayIcon(!isPlaying);   // flip now; the app's state follows
        if (window.AutoDeck && window.AutoDeck.media) window.AutoDeck.media(a);
      });
    });
  }

  function position() {
    var p = rawPosition(performance.now());
    if (state.duration > 0) p = Math.min(p, state.duration);
    return Math.max(0, p);
  }

  /** Re-anchors the clock to `target` ms: glide if close, jump otherwise. */
  function showDelay(ms) {
    var e = document.getElementById('syncVal');
    if (e) e.textContent = (ms > 0 ? '+' : '') + (ms / 1000).toFixed(1) + ' s';
  }
  // Sooner / Later: each tap moves 0.5 s; press and hold to keep going (up to 15 s either way).
  // "Later" = lyrics wait longer for the car's sound; the new delay arrives with the next update.
  var holdT = null;
  function nudge(b) { if (window.AutoDeck && AutoDeck.lyricsDelay) showDelay(AutoDeck.lyricsDelay(+b.getAttribute('data-delay'))); }
  function stopHold() { if (holdT) { clearTimeout(holdT); holdT = null; } }
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('[data-delay]'); if (!b) return;
    e.preventDefault(); stopHold(); nudge(b);
    var rep = function () { nudge(b); holdT = setTimeout(rep, 140); };
    holdT = setTimeout(rep, 450);
  });
  ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach(function (t) { document.addEventListener(t, stopHold, true); });
  document.addEventListener('click', function (e) {   // keyboard (Enter / Space) only; taps are handled above
    var b = e.target.closest && e.target.closest('[data-delay]'); if (b && e.detail === 0) nudge(b);
  });
  function syncClock(target, playing, hard) {
    var now = performance.now();
    var current = rawPosition(now);
    var diff = target - current;
    if (hard || !playing || !state.playing || Math.abs(diff) > SNAP_MS) {
      state.basePos = target;
      state.slew = 0;
    } else {
      // Bake in what's been applied so far, then glide the rest.
      state.basePos = current;
      state.slew = diff;
      state.slewAt = now;
    }
    state.baseAt = now;
    state.playing = playing;
  }

  function findIndex(pos) {
    var lo = 0, hi = state.lines.length - 1, found = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (state.lines[mid][0] <= pos) { found = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return found;
  }

  function showMessage(kind, custom) {
    var m = custom ? [custom, ''] : (messages()[kind] || messages().waiting);
    msgEl.innerHTML = m[0] + (m[1] ? '<small>' + escapeHtml(m[1]) + '</small>' : '');
    msgEl.style.display = 'flex';
    linesEl.style.display = 'none';
    plainEl.style.display = 'none';
  }

  function renderLines() {
    msgEl.style.display = 'none';
    plainEl.style.display = 'none';
    linesEl.style.display = 'block';
    linesEl.innerHTML = state.lines.map(function (l, i) {
      var t = (l[1] || '').trim();
      return '<div class="line' + (t ? '' : ' gap') + '" data-i="' + i + '">' + (t ? escapeHtml(t) : '♪ ♪ ♪') + '</div>';
    }).join('');
    state.index = -2;
  }

  function renderPlain() {
    msgEl.style.display = 'none';
    linesEl.style.display = 'none';
    plainEl.style.display = 'block';
    plainEl.textContent = state.plain;
    plainMax = null;
  }

  function highlight(i) {
    if (i === state.index) return;
    state.index = i;
    var nodes = linesEl.children;
    for (var k = 0; k < nodes.length; k++) {
      var n = nodes[k];
      n.className = 'line' + (n.classList.contains('gap') ? ' gap' : '') +
        (k === i ? ' now' : k < i ? ' past' : (k <= i + 2 ? ' next' : ''));
    }
    // Keep the current line ~40% down the stage.
    var target = nodes[Math.max(i, 0)];
    if (!target) return;
    var anchor = window.innerWidth < window.innerHeight * 1.3 || window.innerWidth < 620 || (window.ddTallLock && window.ddTallLock()) ? 0.3 : 0.4;
    var offset = target.offsetTop + target.offsetHeight / 2 - stage.clientHeight * anchor;
    linesEl.style.transform = 'translateY(' + (-Math.max(offset, -stage.clientHeight * anchor)) + 'px)';
  }

  // Per-frame writes are skipped when nothing visibly changed; the plain-lyrics
  // scroll range is measured once (reset by renderPlain / ddRelayout), not every frame.
  var barShown = '', plainShown = '', plainMax = null;
  var barEl = $('bar');
  function tick() {
    var pos = position();
    if (state.duration > 0) {
      var b = 'scaleX(' + Math.min(1, pos / state.duration).toFixed(4) + ')';
      if (b !== barShown) { barShown = b; barEl.style.transform = b; }
    }
    if (linesEl.style.display === 'block' && state.lines.length) {
      var i = findIndex(pos + LEAD_MS);
      // A tiny backwards correction must not flash the previous line.
      if (i === state.index - 1 && state.lines[state.index] && pos + LEAD_MS > state.lines[state.index][0] - 600) i = state.index;
      highlight(i);
    } else if (plainEl.style.display === 'block' && state.duration > 0) {
      // Unsynced lyrics: scroll gently with song progress.
      if (plainMax === null) plainMax = plainEl.scrollHeight - stage.clientHeight;
      var t = 'translateY(' + (-plainMax * Math.min(pos / state.duration, 1)).toFixed(1) + 'px)';
      if (t !== plainShown) { plainShown = t; plainEl.style.transform = t; }
    }
    requestAnimationFrame(tick);
  }

  /** Called from Kotlin with the JSON payload built in Dart. */
  window.ddUpdate = function (p) {
    if (typeof p === 'string') p = JSON.parse(p);
    if (p && p.layoutMode && window.ddSetLayoutMode) window.ddSetLayoutMode(p.layoutMode);   // Always tall / Automatic
    if (p && p.music) {
      var labels = p.labels;
      p = Object.assign({}, p.music);
      if (labels && !p.labels) p.labels = labels;
    }
    if (p.labels) L = p.labels;

    $('title').textContent = p.title || 'DashMate';
    $('artist').textContent = p.artist || (p.status === 'waiting' ? tr('waiting', 'Waiting for music…') : '');
    var chips = '';
    if (p.app) chips += '<span class="chip">' + escapeHtml(p.app) + '</span>';
    if (p.playing) chips += '<span class="chip live">▶ ' + escapeHtml(tr('playing', 'Playing')) + '</span>';
    if (p.cached) chips += '<span class="chip">' + escapeHtml(tr('cached', 'Cached')) + '</span>';
    if (p.unsynced) chips += '<span class="chip">' + escapeHtml(tr('syncNext', 'Tuned in mid-song · lyrics follow along from the next song')) + '</span>';
    else if (p.approx) chips += '<span class="chip">' + escapeHtml(tr('approx', 'approx. sync')) + '</span>';
    $('chips').innerHTML = chips;

    // Cover is re-sent with every update; only repaint (re-decode + 48px blur) when it changes.
    if ('art' in p && p.art !== lastArt) {
      lastArt = p.art;
      var art = p.art ? 'url("' + p.art + '")' : '';
      $('cover').style.backgroundImage = art;
      // A station badge (no album cover found) is not used as the background: it stays plain.
      $('bg').style.backgroundImage = (p.art && p.art.indexOf('data:image/svg') !== 0) ? art : '';
    }

    var key = (p.title || '') + '|' + (p.artist || '') + '|' + p.status + '|' + (p.lines ? p.lines.length : 0) + '|' + (p.unsynced ? 'u' : 's');
    var transit = p.sentAtMs ? Math.min(Math.max(0, Date.now() - p.sentAtMs), 1500) : 0;
    // delayMs: the car plays the sound a little after the phone's clock (Earlier / Later buttons).
    var target = (p.positionMs || 0) - (p.delayMs || 0) + (p.playing ? transit : 0);
    showDelay(p.delayMs || 0);
    syncClock(target, !!p.playing, key !== state.key);
    setPlayIcon(!!p.playing);
    state.duration = p.durationMs || 0;

    if (key === state.key) return;   // same song & state: only the clock was resynced
    state.key = key;

    if (p.status === 'found' && p.unsynced && p.lines && p.lines.length) {
      // Tuned in mid-song: no moving highlight on a guessed clock; plain lyrics until the next song.
      state.lines = [];
      state.plain = p.lines.map(function (l) { return l[1] || ''; }).join('\n');
      renderPlain();
    } else if (p.status === 'found' && p.lines && p.lines.length) {
      state.lines = p.lines;
      renderLines();
    } else if (p.status === 'found' && p.plain) {
      state.lines = [];
      state.plain = p.plain;
      renderPlain();
    } else {
      state.lines = [];
      showMessage(p.status, p.message);
    }
  };

  /** Recompute scroll offsets (view was hidden, or the car pane resized). */
  window.ddRelayout = function () { state.index = -2; plainMax = null; };
  window.addEventListener('resize', window.ddRelayout);
  document.addEventListener('visibilitychange', window.ddRelayout);

  initControls();
  showMessage('waiting');
  requestAnimationFrame(tick);
  if (window.DriveDeck && window.DriveDeck.ready) window.DriveDeck.ready();
})();
</script>
</body>
</html>
